# Fix PR Reviews with Bob - Trigger
#
# Captures PR review context without secrets so fork reviews can still
# kick off the secret-backed companion workflow via workflow_run.
#
# Opt-in: PR must be labeled `fix-with-bob` and the review body must
# contain `@cuga-bob`.
#
# Authorization: actors in vars.BOB_ALLOWED_ACTORS (default:
# sami-marreed,offerakrabi). Unauthorized labels are removed.
#
# Note: same-repo PRs only for push-back; fork heads are skipped by the
# companion workflow because cuga-bob cannot push to forks.

name: Fix PR Reviews with Bob - Trigger

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  reject-unauthorized-label:
    if: |
      github.event_name == 'pull_request' &&
      github.event.label.name == 'fix-with-bob'
    runs-on: ubuntu-latest
    steps:
      - name: Check actor allowlist
        id: auth
        env:
          ACTOR: ${{ github.actor }}
          BOB_ALLOWED_ACTORS: ${{ vars.BOB_ALLOWED_ACTORS || 'sami-marreed,offerakrabi' }}
        run: |
          ALLOWED=false
          IFS=',' read -ra ACTORS <<< "${BOB_ALLOWED_ACTORS}"
          for allowed in "${ACTORS[@]}"; do
            allowed_trimmed="$(echo "${allowed}" | xargs)"
            if [ "${ACTOR}" = "${allowed_trimmed}" ]; then
              ALLOWED=true
              break
            fi
          done
          echo "allowed=${ALLOWED}" >> "$GITHUB_OUTPUT"

      - name: Remove label and comment
        if: steps.auth.outputs.allowed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOB_GITHUB_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          BOB_ALLOWED_ACTORS: ${{ vars.BOB_ALLOWED_ACTORS || 'sami-marreed,offerakrabi' }}
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/fix-with-bob" \
            || true
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" \
            --body "Removed \`fix-with-bob\`: only \`${BOB_ALLOWED_ACTORS}\` may apply this label (attempted by @${ACTOR})."

  trigger-bob-workflow:
    if: |
      github.event_name == 'pull_request_review' &&
      (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested') &&
      contains(github.event.pull_request.labels.*.name, 'fix-with-bob') &&
      contains(github.event.review.body, '@cuga-bob')
    runs-on: ubuntu-latest

    steps:
      - name: Check actor allowlist
        id: auth
        env:
          ACTOR: ${{ github.actor }}
          BOB_ALLOWED_ACTORS: ${{ vars.BOB_ALLOWED_ACTORS || 'sami-marreed,offerakrabi' }}
        run: |
          ALLOWED=false
          IFS=',' read -ra ACTORS <<< "${BOB_ALLOWED_ACTORS}"
          for allowed in "${ACTORS[@]}"; do
            allowed_trimmed="$(echo "${allowed}" | xargs)"
            if [ "${ACTOR}" = "${allowed_trimmed}" ]; then
              ALLOWED=true
              break
            fi
          done
          if [ "${ALLOWED}" != "true" ]; then
            echo "Skipping trigger: @${ACTOR} is not in BOB_ALLOWED_ACTORS"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Save PR and Review Information
        if: steps.auth.outputs.allowed == 'true'
        id: save_info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "review_id=${{ github.event.review.id }}" >> "$GITHUB_OUTPUT"
          echo "reviewer=${{ github.event.review.user.login }}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}" >> "$GITHUB_OUTPUT"
          echo "review_state=${{ github.event.review.state }}" >> "$GITHUB_OUTPUT"

          jq -n \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --argjson review_id "${{ github.event.review.id }}" \
            --arg reviewer "${{ github.event.review.user.login }}" \
            --arg pr_title "${{ github.event.pull_request.title }}" \
            --arg head_ref "${{ github.event.pull_request.head.ref }}" \
            --arg head_repo "${{ github.event.pull_request.head.repo.full_name }}" \
            --arg review_state "${{ github.event.review.state }}" \
            --arg base_repo "${{ github.repository }}" \
            '{
              pr_number: $pr_number,
              review_id: $review_id,
              reviewer: $reviewer,
              pr_title: $pr_title,
              head_ref: $head_ref,
              head_repo: $head_repo,
              review_state: $review_state,
              base_repo: $base_repo
            }' > pr-review-context.json

          cat pr-review-context.json

      - name: Upload PR review context
        if: steps.auth.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-context
          path: pr-review-context.json
          retention-days: 1

      - name: Create Summary
        if: steps.auth.outputs.allowed == 'true'
        run: |
          {
            echo "### PR Review Trigger"
            echo ""
            echo "- **PR**: #${{ steps.save_info.outputs.pr_number }}"
            echo "- **Review ID**: ${{ steps.save_info.outputs.review_id }}"
            echo "- **Reviewer**: @${{ steps.save_info.outputs.reviewer }}"
            echo "- **Review State**: ${{ steps.save_info.outputs.review_state }}"
            echo "- **Head**: ${{ steps.save_info.outputs.head_repo }}@${{ steps.save_info.outputs.head_ref }}"
          } >> "$GITHUB_STEP_SUMMARY"
