# Secret-backed CI for pull requests from forks.
#
# Fork PRs on `pull_request` never receive secrets. This workflow uses
# `pull_request_target` plus the `external-testing` environment: the job
# starts automatically on every fork PR update, pauses at the environment gate,
# and a required reviewer approves via GitHub's "Review deployments" button
# before secrets are exposed.
#
# Maintainer flow (no label needed):
#   1. Fork PR opens or updates → workflow queues automatically.
#   2. GitHub emails required reviewers / shows "Review deployments" on the run.
#   3. Review the PR diff, click Approve and deploy.
#   4. Tests run with external-testing secrets.
#
# Repo setting note: "Require approval for first-time contributors" under
# Settings → Actions only gates `pull_request` workflows (no secrets). This
# environment gate is what protects secret-backed fork CI.
name: External Fork Tests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (fork, external-testing)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: external-testing
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.WATSONX_API_KEY }}
      AGENT_SETTING_CONFIG: ${{ secrets.AGENT_SETTING_CONFIG }}

    steps:
      - name: Checkout fork head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      # See tests.yml for why this runs as several separate `pytest`
      # invocations instead of one big collection.
      - name: Run unit tests
        run: |
          uv run pytest ./src/cuga/backend/tools_env/registry/tests/
          uv run pytest ./src/cuga/backend/tools_env/registry/mcp_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/api/variables_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/executors/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_agent_core/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_supervisor/tests/
          uv run pytest \
            tests/unit/test_knowledge_engine.py \
            tests/unit/test_session_knowledge.py \
            tests/unit/test_knowledge_routes.py \
            tests/unit/test_cuga_lite_knowledge_scopes.py \
            tests/unit/test_chat_knowledge_mode.py \
            tests/unit/test_chat_agent_knowledge_toggle.py \
            tests/integration/test_knowledge_integration.py
          uv run pytest tests/unit/test_cuga_lite_bind_tools.py
          uv run pytest \
            tests/unit/test_toolguard_provider.py \
            tests/unit/test_policy_tool_guide_loading.py \
            tests/unit/test_async_tool_provider_construction.py \
            tests/unit/test_tool_guard_generation.py \
            tests/unit/test_tool_guard_generation_route.py \
            tests/unit/test_tool_guard_generation_route_sync.py \
            tests/unit/test_policy_frontend_dict_guards_enabled.py \
            tests/unit/test_toolguard_reuse_roundtrip.py
          uv run pytest tests/integration/a2a/ tests/unit/test_a2a_simple_runner_hitl.py
        env:
          PYTHONUNBUFFERED: "1"
          CUGA_THREAD_WORKSPACE_SEED: crm

      - name: Run policy and SDK integration tests
        run: |
          uv run pytest ./src/cuga/backend/cuga_graph/policy/tests
          uv run pytest ./src/cuga/sdk_core/tests/
          uv run pytest ./tests/system/test_manager_api_integration.py
          uv run pytest ./src/system_tests/load/tests/
          uv run pytest tests/unit/test_load_test_mock_llm.py
        env:
          PYTHONUNBUFFERED: "1"
          CUGA_THREAD_WORKSPACE_SEED: crm

      - name: Run mocked concurrent load test
        run: uv run pytest src/system_tests/load/load_test_with_mocked_llm.py -m load --load-test-users 5
        env:
          PYTHONUNBUFFERED: "1"
          CUGA_THREAD_WORKSPACE_SEED: crm

  smoke-pip-isolated:
    name: Wheel install + demo_crm OpenAPI (fork, external-testing)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: external-testing
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.WATSONX_API_KEY }}
      AGENT_SETTING_CONFIG: ${{ secrets.AGENT_SETTING_CONFIG }}

    steps:
      - name: Checkout fork head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Isolated wheel smoke (demo_crm → OpenAPI)
        run: bash scripts/smoke_pip_install_isolated.sh

  stability-tests:
    name: Stability Tests (Python 3.12, fork, external-testing)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: external-testing
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.WATSONX_API_KEY }}
      AGENT_SETTING_CONFIG: ${{ secrets.AGENT_SETTING_CONFIG }}
      PYTHONIOENCODING: utf-8
      CUGA_THREAD_WORKSPACE_SEED: crm

    steps:
      - name: Checkout fork head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run stability tests
        run: uv run pytest -m stability --stability-threshold 88 -n0
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-python-3.12-fork
          path: src/system_tests/e2e/logs/
          retention-days: 7
