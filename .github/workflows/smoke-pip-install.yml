name: Smoke pip install (isolated)

# "Wheel install + demo_crm OpenAPI" is a required context in main's branch
# protection. Do not add paths filters: a PR that skips this workflow never
# reports that context and can never be merged.
# `event_support` is listed for PRs so a stacked PR into it still runs CI — an unmatched filter
# yields an empty check list, which reads as green rather than as "never ran". Same hazard the
# note above describes for paths filters. Remove once event_support merges.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, event_support]
  workflow_dispatch:

concurrency:
  group: smoke-pip-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This workflow only reads the repository. Override on a per-job basis if any
# future job needs to write.
permissions:
  contents: read

jobs:
  smoke-pip-isolated:
    name: Wheel install + demo_crm OpenAPI
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_SETTING_CONFIG: ${{ vars.AGENT_SETTING_CONFIG }}
      WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
      WATSONX_PROJECT_ID: ${{ vars.WATSONX_PROJECT_ID }}
      WATSONX_URL: ${{ vars.WATSONX_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Isolated wheel smoke (demo_crm → OpenAPI)
        run: bash scripts/smoke_pip_install_isolated.sh
