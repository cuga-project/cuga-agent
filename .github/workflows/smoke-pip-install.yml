name: Smoke pip install (isolated)

# "Wheel install + demo_crm OpenAPI" is a required context in main's branch
# protection. Do not add paths filters: a PR that skips this workflow never
# reports that context and can never be merged.
# yields an empty check list, which reads as green rather than as "never ran". Same hazard the
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: smoke-pip-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This workflow only reads the repository. Override on a per-job basis if any
# future job needs to write.
permissions:
  contents: read

jobs:
  model-probe:
    name: watsonx model probe
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      model: ${{ steps.probe.outputs.model }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # gpt-oss-120b on watsonx truncates replies at times (#784). Empty output keeps
      # secrets.MODEL_NAME / the TOML model; otherwise the live-LLM jobs use the fallback.
      - id: probe
        continue-on-error: true
        run: python3 scripts/ci/watsonx_model_probe.py

  smoke-pip-isolated:
    name: Wheel install + demo_crm OpenAPI
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: model-probe
    env:
      AGENT_SETTING_CONFIG: ${{ vars.AGENT_SETTING_CONFIG }}
      WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
      WATSONX_PROJECT_ID: ${{ vars.WATSONX_PROJECT_ID }}
      WATSONX_URL: ${{ vars.WATSONX_URL }}
      MODEL_NAME: ${{ needs.model-probe.outputs.model || secrets.MODEL_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Isolated wheel smoke (demo_crm → OpenAPI)
        run: bash scripts/smoke_pip_install_isolated.sh
