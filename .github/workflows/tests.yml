name: Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGENT_SETTING_CONFIG: ${{ vars.AGENT_SETTING_CONFIG }}
  WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
  WATSONX_PROJECT_ID: ${{ vars.WATSONX_PROJECT_ID }}
  WATSONX_URL: ${{ vars.WATSONX_URL }}
  MODEL_NAME: ${{ secrets.MODEL_NAME }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  PYTHONUNBUFFERED: "1"
  CUGA_THREAD_WORKSPACE_SEED: crm

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - run: uv run ruff check && uv run ruff format --check

  unit-a:
    name: Unit (graph)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run graph unit tests
        run: |
          uv run pytest ./src/cuga/backend/tools_env/registry/tests/
          uv run pytest ./src/cuga/backend/tools_env/registry/mcp_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/api/variables_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/executors/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_agent_core/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_supervisor/tests/

  unit-b:
    name: Unit (knowledge)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run knowledge, citations, tools, and a2a tests
        run: |
          uv run pytest \
            tests/unit/test_knowledge_engine.py \
            tests/unit/test_session_knowledge.py \
            tests/unit/test_knowledge_routes.py \
            tests/unit/test_cuga_lite_knowledge_scopes.py \
            tests/unit/test_chat_knowledge_mode.py \
            tests/unit/test_chat_agent_knowledge_toggle.py \
            tests/integration/test_knowledge_integration.py
          uv run pytest \
            tests/unit/test_source_ledger.py \
            tests/unit/test_citation_resolver.py \
            tests/unit/test_citation_settings.py \
            tests/unit/test_final_answer_citations.py \
            tests/unit/test_envelope_citations.py \
            tests/unit/test_sdk_citations.py \
            tests/unit/test_server_citation_egress.py \
            tests/unit/test_session_settings_routes.py \
            tests/unit/test_session_citation_override.py \
            tests/unit/test_ephemeral_stream_events.py \
            tests/unit/test_config_db_reset_wal_sidecars.py \
            tests/unit/test_embedder_cache_resilience.py \
            tests/unit/test_knowledge_copy_source_files.py \
            tests/unit/test_knowledge_envelope_rank_fields.py \
            tests/unit/test_e2e_server_stack.py
          uv run pytest tests/unit/test_cuga_lite_bind_tools.py \
            tests/unit/test_bind_tools_safe_fallback.py \
            tests/unit/test_tool_use_failed_recovery.py
          uv run pytest tests/unit/test_variables_addendum_not_persisted.py
          uv run pytest \
            tests/unit/test_toolguard_provider.py \
            tests/unit/test_policy_tool_guide_loading.py \
            tests/unit/test_async_tool_provider_construction.py \
            tests/unit/test_tool_guard_generation.py \
            tests/unit/test_tool_guard_generation_route.py \
            tests/unit/test_tool_guard_generation_route_sync.py \
            tests/unit/test_policy_frontend_dict_guards_enabled.py \
            tests/unit/test_toolguard_reuse_roundtrip.py
          uv run pytest tests/integration/a2a/ tests/unit/test_a2a_simple_runner_hitl.py

  policy-a:
    name: Policy (guards)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run policy guard and playbook tests
        run: |
          uv run pytest \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_intent_guard.py \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_intent_guard_priority.py \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_output_formatter.py \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_playbook_guidance.py \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_playbook_refinement.py \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_tool_enrichment.py

  policy-b:
    name: Policy (matching)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run remaining policy tests
        run: |
          uv run pytest \
            src/cuga/backend/cuga_graph/policy/tests/test_e2e_healthcare_family_claims.py \
            src/cuga/backend/cuga_graph/policy/tests/test_tool_approval_full_graph.py \
            src/cuga/backend/cuga_graph/policy/tests/test_filesystem_sync.py \
            src/cuga/backend/cuga_graph/policy/tests/test_keyword_operator.py \
            src/cuga/backend/cuga_graph/policy/tests/test_nl_trigger_conflict_fallback.py \
            src/cuga/backend/cuga_graph/policy/tests/test_nl_trigger_conflict_resolution.py \
            src/cuga/backend/cuga_graph/policy/tests/test_similarity_integration.py \
            src/cuga/backend/cuga_graph/policy/tests/test_utils.py

  sdk:
    name: SDK integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - run: uv run pytest ./src/cuga/sdk_core/tests/

  extras:
    name: Manager and load units
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run manager API and load unit tests
        run: |
          uv run pytest ./tests/system/test_manager_api_integration.py
          uv run pytest ./src/system_tests/load/tests/
          uv run pytest tests/unit/test_load_test_mock_llm.py

  load:
    name: Mocked load
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - run: uv run pytest src/system_tests/load/load_test_with_mocked_llm.py -m load --load-test-users 5

  unit-tests:
    name: Unit Tests
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, unit-a, unit-b, policy-a, policy-b, sdk, extras, load]
    steps:
      - name: Require parallel jobs
        run: |
          set -e
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-a.result }}" \
            "${{ needs.unit-b.result }}" \
            "${{ needs.policy-a.result }}" \
            "${{ needs.policy-b.result }}" \
            "${{ needs.sdk.result }}" \
            "${{ needs.extras.result }}" \
            "${{ needs.load.result }}"
          do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed"
              exit 1
            fi
          done

  pgvector-integration:
    name: pgvector Integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CUGA_KNOWLEDGE_PGVECTOR_CONNECTION_STRING: postgresql://cuga:cuga@localhost:5432/cuga_test  # pragma: allowlist secret
    services:
      pgvector:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: cuga
          POSTGRES_PASSWORD: cuga  # pragma: allowlist secret
          POSTGRES_DB: cuga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuga -d cuga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Enable pgvector extension
        env:
          PGPASSWORD: cuga  # pragma: allowlist secret
        run: |
          psql -h localhost -U cuga -d cuga_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run pgvector integration tests (MVT)
        run: uv run pytest tests/integration/test_knowledge_pgvector_rollback.py
              -v -m pgvector -o addopts="-ra --strict-markers --import-mode=importlib"
              --maxfail=3 --durations=10
      - name: Dump Postgres logs on failure
        if: failure()
        run: |
          docker ps -a
          for cid in $(docker ps -aq); do
            echo "=== logs $cid ==="
            docker logs "$cid" 2>&1 | tail -100 || true
          done
