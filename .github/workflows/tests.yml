name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGENT_SETTING_CONFIG: ${{ vars.AGENT_SETTING_CONFIG }}
  WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
  WATSONX_PROJECT_ID: ${{ vars.WATSONX_PROJECT_ID }}
  WATSONX_URL: ${{ vars.WATSONX_URL }}
  MODEL_NAME: ${{ secrets.MODEL_NAME }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  PYTHONUNBUFFERED: "1"
  CUGA_THREAD_WORKSPACE_SEED: crm

# Shards are directories (and markers), not file allowlists. New tests join CI
# by landing in the matching path or by marker opt-out — do not edit this file
# to add a test_*.py path. See AGENTS.md.

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - run: uv run ruff check && uv run ruff format --check

  unit-a:
    name: Unit (graph)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      # Separate pytest processes: these suites share process-global singletons
      # (FastAPI app, policy/config DB, variables manager).
      - name: Run colocated graph unit tests
        run: |
          uv run pytest ./src/cuga/backend/tools_env/registry/tests/
          uv run pytest ./src/cuga/backend/tools_env/registry/mcp_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/api/variables_manager/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/executors/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_agent_core/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_lite/tests/
          uv run pytest ./src/cuga/backend/cuga_graph/nodes/cuga_supervisor/tests/

  unit-b:
    name: Unit (tests/)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run tests/unit and tests/integration
        run: >
          uv run pytest tests/unit tests/integration
          -m "not manual and not pgvector and not load and not e2e and not stability and not opensandbox"

  policy-a:
    name: Policy (e2e)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run policy e2e tests
        run: uv run pytest src/cuga/backend/cuga_graph/policy/tests/test_e2e_*.py

  policy-b:
    name: Policy (unit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run remaining policy tests
        run: >
          uv run pytest src/cuga/backend/cuga_graph/policy/tests
          --ignore-glob='**/test_e2e_*.py'

  sdk:
    name: SDK integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      # A CLI -m replaces addopts' -m, so restate the full exclusion list.
      - run: >
          uv run pytest ./src/cuga/sdk_core/tests/
          -m "not manual and not pgvector and not load and not e2e and not stability and not opensandbox"

  extras:
    name: Manager and load units
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Run manager API and load unit tests
        run: |
          uv run pytest tests/system src/system_tests/load/tests/

  load:
    name: Mocked load
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - run: uv run pytest src/system_tests/load/load_test_with_mocked_llm.py -m load --load-test-users 5

  unit-tests:
    name: Unit Tests
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, unit-a, unit-b, policy-a, policy-b, sdk, extras, load]
    steps:
      - name: Require parallel jobs
        run: |
          set -e
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-a.result }}" \
            "${{ needs.unit-b.result }}" \
            "${{ needs.policy-a.result }}" \
            "${{ needs.policy-b.result }}" \
            "${{ needs.sdk.result }}" \
            "${{ needs.extras.result }}" \
            "${{ needs.load.result }}"
          do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed"
              exit 1
            fi
          done

  pgvector-integration:
    name: pgvector Integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CUGA_KNOWLEDGE_PGVECTOR_CONNECTION_STRING: postgresql://cuga:cuga@localhost:5432/cuga_test  # pragma: allowlist secret
    services:
      pgvector:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: cuga
          POSTGRES_PASSWORD: cuga  # pragma: allowlist secret
          POSTGRES_DB: cuga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuga -d cuga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cuga
      - name: Enable pgvector extension
        env:
          PGPASSWORD: cuga  # pragma: allowlist secret
        run: |
          psql -h localhost -U cuga -d cuga_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run pgvector integration tests (MVT)
        run: uv run pytest tests/integration/test_knowledge_pgvector_rollback.py
              -v -m pgvector -o addopts="-ra --strict-markers --import-mode=importlib"
              --maxfail=3 --durations=10
      - name: Dump Postgres logs on failure
        if: failure()
        run: |
          docker ps -a
          for cid in $(docker ps -aq); do
            echo "=== logs $cid ==="
            docker logs "$cid" 2>&1 | tail -100 || true
          done
