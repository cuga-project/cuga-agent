# Builds the DAM-compatible CUGA image and pushes it to GHCR.
# Contract: https://pages.github.ibm.com/dam-agents/docs/guides/custom-image/
# Optional repository variable: DAM_IMAGE_NAME (default: cuga-agent-dam)
name: Deploy DAM Image to GHCR

on:
  push:
    branches:
      - feat/dam-custom-image
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g. 1.0.0). Omit to use git tag or latest.'
        required: false
        default: ''
      dam_base_version:
        description: 'Version of quay.io/dam-agents/claude-code to build on.'
        required: false
        default: '0.2.21'
      platforms:
        description: 'Target platforms. DAM clusters normally run linux/amd64.'
        required: false
        default: 'linux/amd64'

env:
  IMAGE_NAME: ${{ vars.DAM_IMAGE_NAME || 'cuga-agent-dam' }}

jobs:
  deploy:
    name: Build and push DAM image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=dam-test,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ inputs.image_tag == '' && github.event_name != 'push' }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Build for the runner architecture first and check the DAM contract before pushing.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/dam/Dockerfile
          load: true
          tags: dam-smoke:test
          build-args: |
            DAM_BASE_VERSION=${{ inputs.dam_base_version || '0.2.21' }}
          cache-from: type=gha,scope=dam-image
          cache-to: type=gha,scope=dam-image,mode=max

      - name: Smoke test (user, launchers, ACP initialize)
        run: |
          set -e
          test "$(docker run --rm --entrypoint id dam-smoke:test -u)" = "65532"
          docker run --rm --entrypoint sh dam-smoke:test -c 'test -x /usr/local/bin/harness-chat && test -x /usr/local/bin/harness-terminal && test -f /app/working-dir/AGENTS.md'
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientCapabilities":{}}}'
          response="$(echo "$request" | timeout 120 docker run --rm -i --entrypoint /usr/local/bin/harness-chat dam-smoke:test | head -n 1)"
          echo "$response"
          echo "$response" | grep -q '"id":1' && echo "$response" | grep -q '"result"'

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/dam/Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DAM_BASE_VERSION=${{ inputs.dam_base_version || '0.2.21' }}
          cache-from: type=gha,scope=dam-image
