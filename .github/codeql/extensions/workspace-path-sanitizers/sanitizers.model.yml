extensions:
  # Return values of workspace path helpers are confined under cuga_workspace.
  # See child_path_under() and tests/unit/test_resolve_workspace_path.py.
  #
  # The trailing "!" on each module name is required and is not a typo. Without it
  # CodeQL reads the type as "an instance of this module", which never matches, and
  # every entry below silently does nothing. See ApiGraphModelsSpecific.qll,
  # getExtraNodeFromType: suffix "!" selects the module itself, no suffix selects
  # getAnInstance().
  #
  # Default setup detects model packs in .github/codeql/extensions/ automatically,
  # so this pack is loaded without any workflow or repository configuration.
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[child_path_under].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[safe_thread_id].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[resolve_workspace_path].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[thread_workspace_root].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[assert_resolved_path_under].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[write_bytes_under].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.cuga_graph.nodes.cuga_lite.executors.filesystem.paths!",
          "Member[read_bytes_under].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.server.workspace_upload!",
          "Member[sanitize_upload_filename].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.server.workspace_upload!",
          "Member[_validated_thread_id].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.server.workspace_upload!",
          "Member[_uploads_root_host].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.server.workspace_upload!",
          "Member[_manifest_host_path].ReturnValue",
          "path-injection",
        ]
      - [
          "cuga.backend.server.workspace_upload!",
          "Member[_upload_file_host_path].ReturnValue",
          "path-injection",
        ]
      # The table name the embedding store puts into its SQL. safe_sql_identifier() raises
      # unless the name matches ^[a-z][a-z0-9_]{0,62}$, so its return value cannot change
      # the statement. See tests/unit/test_prod_embedding_identifiers.py. It is in its own
      # module because an entry matches only calls from modules that import the function.
      - [
          "cuga.backend.storage.sql_identifier!",
          "Member[safe_sql_identifier].ReturnValue",
          "sql-injection",
        ]
