[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email_mcp"
version = "0.1.3"
description = "MCP Server for email"
license = "Apache-2.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "pydantic",
    "fastmcp>=2.14.0"
]

[tool.uv]
package = true
override-dependencies = [
    "pillow>=12.1.1",
    "urllib3>=2.6.0",
    "nltk>=3.9.3",
]

[project.scripts]
email_mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "utils"]
