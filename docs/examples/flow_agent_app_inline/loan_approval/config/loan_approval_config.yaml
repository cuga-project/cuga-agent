# Loan Approval Process Configuration

flow:
  name: "Loan Approval Process"
  id: "loan_approval_v1"
  version: "1.0"
  bpmn_file: "BPMNdiagram.bpmn"

workflow_engine:
  type: flowable
  url: http://localhost:8080/flowable-ui/process-api
  username: admin
  password: test
  deploy: false
  process_definition_key: Process_1s3q83l

variables:
  credit_score: 0.0
  decision: "undecided"

tasks:
  - id: "Activity_0oydey5"
    mode: task_agent
    output_mapping:
      credit_score: credit_score
    agent:
      name: "credit_checker"
      system_instruction: "Analyses applicant information and returns a credit score 0.0–1.0"
      tools: []
      policy: "../policies/task-credit_check.md"

