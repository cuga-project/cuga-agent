# Ordo Flow Configuration
#
# Task-only config: no bpmn_file required.
# Workflow execution is delegated to MCPOrdo (external workflow MCP server).
# Task IDs match MCPOrdo's agent_goal.agent_name values so no ID
# translation is needed in the mediator.

flow:
  name: "Ordo Loan Approval"
  id: "loan_approval_stub"

variables:
  applicant_name: ""
  applicant_id: ""
  loan_amount: 1000
  credit_score: 0.0
  approved: false
  rejection_reason: ""
  loan_granted: false

tasks:
  # Task ID == agent_name reported in MCPOrdo's AgentGoal.
  - id: "credit_checker"
    mode: task_agent
    output_mapping:
      credit_score: credit_score
    agent:
      name: "credit_checker"
      system_instruction: >
        Analyse the applicant's financial profile and produce a normalised
        credit score in the range 0.0–1.0. Respond with a JSON object
        containing at least 'credit_score' (float) and 'explanation' (str).
      tools: []
      policy: "../../loan_approval/policies/task-credit_check.md"
