# Ordo Flow Configuration
#
# Task-only config: no bpmn_file required.
# Workflow execution is delegated to the real ro MCP server.
#
# Task IDs must match the `name:` of each `kind: goal` step in the .ro
# program so the mediator can route agent_goal pauses to the right agent.
#
# hello-world.ro goal step: name: "compose-greeting"

flow:
  name: "Hello World"
  id: "hello-world"
  ro_source_file: "path-to-clone/examples/hello-world/hello-world.ro"
  input_args:
    name: "world"

variables:
  # Mirrors the `state:` block in hello-world.ro
  name: "world"
  greeting: ""

tasks:
  # Task ID == the `name:` of the goal step in hello-world.ro
  - id: "compose-greeting"
    mode: task_agent
    output_mapping:
      greeting: greeting
    agent:
      name: "compose-greeting"
      system_instruction: >
        Write a short, friendly greeting for the provided name.
        Return only the greeting string — no explanation, no JSON wrapper.
      tools: []
