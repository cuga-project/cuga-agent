      tools: []

  - id: "get-context-contract"
    mode: task_agent
    output_mapping:
      context: context
    agent:
      name: "get-context-contract"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - get_context_contract: Requires k8_object (namespace/kind/name format preferred), snapshot_dir (path to snapshot directory). Optional: topology_file, start_time, end_time, page, deps_per_page
        - topology_analysis: Requires topology_file (path to topology JSON), entity (name or partial match)
        - event_analysis: Requires events_file. Optional: filters, group_by, agg, sort_by, limit, offset, start_time, end_time
        - alert_analysis: Requires base_dir. Optional: time_basis, filters, group_by, agg, sort_by, limit, offset, start_time, end_time
        - get_metric_anomalies: Requires k8_object_name, base_dir (path to metrics directory). Optional: metric_name_filter, start_time, end_time, raw_content
        - get_k8_spec: Requires k8s_objects_file, k8_object_name. Optional: return_all_observations, include_metadata
        - k8s_spec_change_analysis: Requires k8s_objects_file. Optional: k8_object_name, start_time, end_time, max_changes_per_diff, include_reference_spec, include_flat_change_items, limit, offset, include_no_change
      tools:
        - get_context_contract
        - topology_analysis
        - event_analysis
        - alert_analysis
        - get_metric_anomalies
        - get_k8_spec
        - k8s_spec_change_analysis

  - id: "classify-revisit"
    mode: task_agent
    output_mapping:
