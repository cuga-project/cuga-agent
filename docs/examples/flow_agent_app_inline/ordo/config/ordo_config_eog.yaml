  - id: "get-spec-anomalies"
    mode: task_agent
    output_mapping:
      raw_spec_anomalies: raw_spec_anomalies
    agent:
      name: "get-spec-anomalies"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - k8s_spec_change_analysis: Requires k8s_objects_file (path to K8s objects TSV). Optional: k8_object_name, start_time, end_time, max_changes_per_diff, include_reference_spec, include_flat_change_items, limit, offset, include_no_change
        - get_k8_spec: Requires k8s_objects_file, k8_object_name (namespace/kind/name format preferred). Optional: return_all_observations, include_metadata
      tools:
        - k8s_spec_change_analysis
        - get_k8_spec

  - id: "filter-spec-anomalies"
    mode: task_agent
    output_mapping:
      filtered_spec_anomalies: filtered_spec_anomalies
    agent:
      name: "filter-spec-anomalies"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - k8s_spec_change_analysis: Requires k8s_objects_file (path to K8s objects TSV). Optional: k8_object_name, start_time, end_time, max_changes_per_diff, include_reference_spec, include_flat_change_items, limit, offset, include_no_change
        - get_k8_spec: Requires k8s_objects_file, k8_object_name (namespace/kind/name format preferred). Optional: return_all_observations, include_metadata
      tools:
        - k8s_spec_change_analysis
        - get_k8_spec

  - id: "select-candidates"
    mode: task_agent
    output_mapping:
      candidates: candidates
    agent:
      name: "select-candidates"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
