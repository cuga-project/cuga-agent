      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - event_analysis: Requires events_file (path to Kubernetes events TSV). Optional: filters (dict), group_by (string/array), agg, sort_by, limit, offset, start_time, end_time
