# Ordo Flow Configuration — SBP-EoG
#
# Task-only config: no bpmn_file required.
# Workflow execution is delegated to the real ro MCP server.
#
# ro_source_file points to the .ro workflow definition passed to register_workflow.
# input_args is optional and is passed to register_workflow as json.input_args.
#
# Task IDs must match each `kind: goal` `name:` in the .ro program so the
# mediator can route RO goal pauses to the right FlowAgent task.

flow:
  name: "SBP-EoG"
  id: "sbp-eog"
  ro_source_file: "<path-to-clone>/examples/itbench-lite/sbp-eog.ro"
  input_args:
    data_dir: "<path-to-clone>/examples/itbench-lite/test_data/snapshots/sre/v0.2-B96DF826-4BB2-4B62-97AB-6D84254C53D7/Scenario-1"

# Shared MCP server pool. Tools are loaded once, but each task agent only
# receives the subset explicitly listed under that task's agent.tools.
mcpServers:
  sre_utils:
    command: "<path-to-clone>/examples/itbench-lite/start_sre_mcp.sh"
    args: []
    env:
      PYTHON: "/<path-to-root>/.venv/bin/python"

variables:
  data_dir: "<path-to-clone>/examples/itbench-lite/test_data/snapshots/sre/v0.2-B96DF826-4BB2-4B62-97AB-6D84254C53D7/Scenario-1"
  namespace_scope: ""
  budget: 30
  k_thresh: 3

  topology: ""
  alerts: ""
  golden_signals: {}
  investigation_window: ""
  raw_events: ""
  filtered_events: ""
  raw_spec_anomalies: ""
  filtered_spec_anomalies: ""
  candidates: []
  context: ""
  classification: {}
  origin_verification: {}
  neighbors_in_eg: []
  frontier: []
  confidence_check: {}
  sanity_check: {}
  report: ""

tasks:
  - id: "build-topology"
    mode: task_agent
    output_mapping:
      topology: topology
    agent:
      name: "build-topology"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - build_topology: Requires arch_file (path to application architecture JSON), k8s_objects_file (path to Kubernetes objects TSV), output_file (path to write topology JSON output)
      tools:
        - build_topology

  - id: "get-alerts"
    mode: task_agent
    output_mapping:
      alerts: alerts
    agent:
      name: "get-alerts"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - alert_summary: Requires base_dir (path to alerts directory). Optional: time_basis (snapshot/activeAt), start_time, end_time, state_filter, min_duration_min, limit
        - alert_analysis: Requires base_dir (path to alerts directory). Optional: time_basis (snapshot/activeAt), filters (dict), group_by (string/array), agg, sort_by, limit, offset, start_time, end_time
      tools:
        - alert_summary
        - alert_analysis

  - id: "extract-golden-signals"
    mode: task_agent
    output_mapping:
      golden_signals: golden_signals
    agent:
      name: "extract-golden-signals"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
        
        Tool Arguments:
        - alert_summary: Requires base_dir. Optional: time_basis, start_time, end_time, state_filter, min_duration_min, limit
        - alert_analysis: Requires base_dir. Optional: time_basis, filters, group_by, agg, sort_by, limit, offset, start_time, end_time
        - metric_analysis: Requires base_dir (path to metrics directory). Optional: k8_object_name, object_pattern, metric_names (array), eval, filters, group_by, agg, start_time, end_time, verbosity, limit, sort_by, include_tags, include_buckets, labels_keep
        - get_trace_error_tree: Requires trace_file (path to OTEL traces TSV). Optional: service_name, span_kind, pivot_time, delta_time, error_threshold_pct, latency_threshold_pct
      tools:
        - alert_summary
        - alert_analysis
        - metric_analysis
        - get_trace_error_tree

  - id: "select-investigation-window"
    mode: task_agent
    output_mapping:
      investigation_window: investigation_window
    agent:
      name: "select-investigation-window"
      system_instruction: >
        Fulfill the RO goal using the goal description and process variables.
        Return only the schema-valid goal result, with no explanatory wrapper.
      tools: []

  - id: "get-events"
    mode: task_agent
    output_mapping:
      raw_events: raw_events
    agent:
