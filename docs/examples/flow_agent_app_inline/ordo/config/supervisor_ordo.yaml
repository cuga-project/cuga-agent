# Ordo Supervisor Configuration
#
# Demonstrates the MCP-2-MCP mediator architecture with a real external engine:
#
#   [FlowAgent] ←→ [MCPFlowBridge] ←→ [MCP2MCPMediator] ←→ [ro mcp]
#
# The ordo_flow_agent is a type: flow_agent_ordo — it is initialised from
# ordo_config.yaml (task definitions only, no BPMN file).
#
# The hello-world.ro program must be registered on the ro mcp server before
# a session can be started.  run_with_mcp.py handles that step.
#
# process_key must match the workflow_id used when registering the program
# (i.e. the `name:` field in hello-world.ro → "hello-world").

supervisor:
  model:
  description: "Hello World workflow — execution via ro mcp (real Ordo engine)"
  special_instructions: |
    You orchestrate the hello-world workflow through the Ordo FlowAgent.

    The ordo_flow_agent is backed by the real ro MCP server.  When the
    workflow reaches the compose-greeting goal, execution pauses and
    MCPFlowBridge forwards the task to the FlowAgent's CugaAgent, which
    composes the greeting, then resumes the workflow with the result.

    When a user provides a name, delegate to ordo_flow_agent and present
    the resulting greeting once the workflow completes.

    **Initial Greeting:**
    👋 Welcome to the Ordo Hello-World demo!

    Tell me a name and I'll run the hello-world workflow to compose a greeting for it.

agents:
  - name: ordo_flow_agent
    type: flow_agent_ordo
    flow_config: "ordo_config.yaml"
    process_key: "hello-world"
    # Connect to the real ro MCP server via stdio transport.
    # Remove or comment out this block to fall back to the in-process stub.
    mcp_server:
      command: "ro"
      args: ["mcp"]
    description: >
      FlowAgent backed by the real ro MCP server via MCPFlowBridge.
      Workflow execution is managed externally; FlowAgent handles the
      compose-greeting goal when ro pauses with an agent_goal.
