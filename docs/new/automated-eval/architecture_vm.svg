<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 12px; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .vm  { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
      .github { fill: #f9fafb; stroke: #111827; stroke-width: 1.5; }
      .store  { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .worker { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .label { fill: #111827; }
      .mute  { fill: #4b5563; font-size: 11px; }
      .edge  { fill: none; stroke: #374151; stroke-width: 1.5; }
      .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 1.5; }
      .edgeLabel { fill: #374151; font-size: 11px; }
      .edgeLabelBlue { fill: #2563eb; font-size: 11px; }
      .containerLabel { fill: #4338ca; font-weight: 600; font-size: 12px; }
    </style>
  </defs>

  <text x="40" y="36" class="title">Architecture A — Persistent VM listener</text>
  <text x="40" y="56" class="subtitle">GitHub webhook → dispatcher on a long-lived VM → worker pool runs Vakra / AppWorld → results posted back to PR</text>

  <!-- GitHub -->
  <rect x="40" y="100" width="200" height="120" rx="8" class="github"/>
  <text x="140" y="128" text-anchor="middle" class="label" font-weight="600">GitHub</text>
  <text x="140" y="152" text-anchor="middle" class="mute">PR opened / synced</text>
  <text x="140" y="170" text-anchor="middle" class="mute">PR body ☑ checkbox</text>
  <text x="140" y="188" text-anchor="middle" class="mute">/bench comment</text>
  <text x="140" y="206" text-anchor="middle" class="mute">receives status + comment</text>

  <!-- VM container -->
  <rect x="320" y="90" width="540" height="430" rx="10" class="vm"/>
  <text x="340" y="115" class="containerLabel">VM (always on)</text>

  <!-- Dispatcher -->
  <rect x="350" y="140" width="220" height="110" rx="6" class="box"/>
  <text x="460" y="164" text-anchor="middle" class="label" font-weight="600">dispatcher (FastAPI)</text>
  <text x="460" y="186" text-anchor="middle" class="mute">verifies HMAC</text>
  <text x="460" y="204" text-anchor="middle" class="mute">parses ☑ / /bench</text>
  <text x="460" y="222" text-anchor="middle" class="mute">sets commit status = pending</text>
  <text x="460" y="240" text-anchor="middle" class="mute">enqueues one job per benchmark</text>

  <!-- Queue -->
  <rect x="610" y="140" width="220" height="110" rx="6" class="box"/>
  <text x="720" y="164" text-anchor="middle" class="label" font-weight="600">queue</text>
  <text x="720" y="186" text-anchor="middle" class="mute">redis / sqlite</text>
  <text x="720" y="208" text-anchor="middle" class="mute">{pr, sha, bench, attempt}</text>

  <!-- Worker pool -->
  <rect x="350" y="290" width="480" height="150" rx="6" class="worker"/>
  <text x="590" y="314" text-anchor="middle" class="label" font-weight="600">worker pool (subprocess / tmux)</text>
  <text x="590" y="338" text-anchor="middle" class="mute">checkout PR SHA → setup → run → score → teardown</text>
  <rect x="380" y="358" width="200" height="62" rx="6" class="box"/>
  <text x="480" y="380" text-anchor="middle" class="label" font-weight="600">vakra runner</text>
  <text x="480" y="400" text-anchor="middle" class="mute">github.com/IBM/vakra</text>
  <rect x="600" y="358" width="200" height="62" rx="6" class="box"/>
  <text x="700" y="380" text-anchor="middle" class="label" font-weight="600">appworld runner</text>
  <text x="700" y="400" text-anchor="middle" class="mute">stonybrooknlp/appworld</text>

  <!-- Artifacts -->
  <rect x="350" y="460" width="220" height="50" rx="6" class="store"/>
  <text x="460" y="481" text-anchor="middle" class="label" font-weight="600">artifacts</text>
  <text x="460" y="499" text-anchor="middle" class="mute">NFS / IBM COS — logs, scorecard.json</text>

  <!-- Baseline cache -->
  <rect x="610" y="460" width="220" height="50" rx="6" class="store"/>
  <text x="720" y="481" text-anchor="middle" class="label" font-weight="600">baseline cache</text>
  <text x="720" y="499" text-anchor="middle" class="mute">scorecard(main@merge-base)</text>

  <!-- GitHub API target -->
  <rect x="900" y="290" width="170" height="120" rx="8" class="github"/>
  <text x="985" y="316" text-anchor="middle" class="label" font-weight="600">GitHub API</text>
  <text x="985" y="340" text-anchor="middle" class="mute">commit status</text>
  <text x="985" y="358" text-anchor="middle" class="mute">PR comment</text>
  <text x="985" y="376" text-anchor="middle" class="mute">check-run output</text>
  <text x="985" y="398" text-anchor="middle" class="mute">artifact links</text>

  <!-- Edges -->
  <!-- GitHub -> dispatcher -->
  <path d="M 240,160 L 350,180" class="edge" marker-end="url(#arr)"/>
  <text x="260" y="155" class="edgeLabel">webhook (HMAC)</text>

  <!-- dispatcher -> queue -->
  <path d="M 570,195 L 610,195" class="edge" marker-end="url(#arr)"/>

  <!-- queue -> worker -->
  <path d="M 720,250 L 720,290" class="edge" marker-end="url(#arr)"/>
  <text x="730" y="275" class="edgeLabel">pop job</text>

  <!-- worker -> artifacts -->
  <path d="M 480,440 L 460,460" class="edge" marker-end="url(#arr)"/>
  <text x="380" y="455" class="edgeLabel">upload</text>

  <!-- worker -> baseline -->
  <path d="M 700,440 L 720,460" class="edge" marker-end="url(#arr)"/>
  <text x="745" y="455" class="edgeLabel">read/write</text>

  <!-- worker -> GitHub API -->
  <path d="M 830,380 L 900,360" class="edgeBlue" marker-end="url(#arrBlue)"/>
  <text x="840" y="355" class="edgeLabelBlue">post results</text>

  <!-- GitHub API -> GitHub (status visible on PR) -->
  <path d="M 985,290 C 985,240 600,60 140,100" class="edgeBlue" marker-end="url(#arrBlue)" stroke-dasharray="4 3"/>
  <text x="540" y="80" class="edgeLabelBlue">status + comment surface on PR</text>

  <!-- Legend -->
  <g transform="translate(40, 600)">
    <text x="0" y="0" class="label" font-weight="600">Flow</text>
    <text x="0" y="20" class="mute">1. GitHub webhook → dispatcher verifies HMAC and parses checkboxes / slash command.</text>
    <text x="0" y="38" class="mute">2. Dispatcher sets commit status=pending and enqueues one job per selected benchmark.</text>
    <text x="0" y="56" class="mute">3. Worker clones PR SHA, runs setup → benchmark → score → teardown; streams logs + scorecard to storage.</text>
    <text x="0" y="74" class="mute">4. Worker diffs vs cached baseline (main@merge-base) and posts PR comment + commit status via GitHub API.</text>
  </g>
</svg>
