<svg xmlns="http://www.w3.org/2000/svg" width="772" height="616" viewBox="0 0 772 616" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="772" height="616" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1c1b1a">FIRE ⑨ — the ACTION half (trigger ▸ agent ▸ ACTION)</text>
<text x="30" y="58" font-size="13" fill="#8a8785">Not just notify — ACT. After the agent answers, a connector ACTION runs as a step in the SAME AP flow. Gmail is the live pilot.</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker><marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#1c1b1a" stroke-width="1.2"/></marker></defs>
<line x1="119" y1="142" x2="119" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="38" y="96" width="162" height="46" rx="9" fill="#8a8785"/>
<text x="119" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Gmail</text>
<line x1="297" y1="142" x2="297" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="216" y="96" width="162" height="46" rx="9" fill="#b06f10"/>
<text x="297" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Activepieces</text>
<line x1="475" y1="142" x2="475" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="394" y="96" width="162" height="46" rx="9" fill="#2b5fd9"/>
<text x="475" y="122" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">CUGA</text>
<text x="475" y="137" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">/invoke</text>
<line x1="653" y1="142" x2="653" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="572" y="96" width="162" height="46" rx="9" fill="#1a7f4b"/>
<text x="653" y="122" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">cuga → mailbot</text>
<text x="653" y="137" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">(supervisor picks)</text>
<text x="208.0" y="152" font-size="12" fill="#1c1b1a" text-anchor="middle">poll: new mail?  (AP-held OAuth)</text>
<line x1="297" y1="160" x2="126" y2="160" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="208.0" y="204" font-size="12" fill="#1c1b1a" text-anchor="middle">new email {subject, from, body}</text>
<line x1="119" y1="212" x2="290" y2="212" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<text x="386.0" y="256" font-size="12" fill="#1c1b1a" text-anchor="middle">POST /invoke {source:gmail, payload}</text>
<line x1="297" y1="264" x2="468" y2="264" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="564.0" y="308" font-size="12" fill="#1c1b1a" text-anchor="middle">draft a reply to this email</text>
<line x1="475" y1="316" x2="646" y2="316" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="564.0" y="360" font-size="12" fill="#1c1b1a" text-anchor="middle">200 {answer: the reply text}</text>
<line x1="653" y1="368" x2="482" y2="368" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<rect x="30" y="404" width="712" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="386" y="424" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 the flow's NEXT step is a gmail ACTION — AP runs it with the SAME connection</text>
<text x="208.0" y="456" font-size="12" fill="#1c1b1a" text-anchor="middle">action step: reply_to_email {body:{{step_1.body.answer}}}</text>
<line x1="297" y1="464" x2="126" y2="464" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="30" y="500" width="712" height="30" rx="6" fill="#f4f3f1" stroke="#7a3fa8" stroke-opacity="0.55"/>
<text x="386" y="520" font-size="12" fill="#7a3fa8" text-anchor="middle" font-style="italic">3 gates guard the arm: deterministic build · AP validity gate · LLM verifier</text>
</svg>