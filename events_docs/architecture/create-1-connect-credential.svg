<svg xmlns="http://www.w3.org/2000/svg" width="1294" height="720" viewBox="0 0 1294 720" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1294" height="720" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1c1b1a">CREATE ① — connect a credential</text>
<text x="30" y="58" font-size="13" fill="#8a8785">OAuth (gmail/github/box). CUGA hands AP the authorization CODE; AP owns the token forever.</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker><marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#1c1b1a" stroke-width="1.2"/></marker></defs>
<line x1="119" y1="142" x2="119" y2="696" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="38" y="96" width="162" height="46" rx="9" fill="#6b6866"/>
<text x="119" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">You</text>
<line x1="297" y1="142" x2="297" y2="696" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="216" y="96" width="162" height="46" rx="9" fill="#8a8785"/>
<text x="297" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Browser</text>
<line x1="475" y1="142" x2="475" y2="696" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="394" y="96" width="162" height="46" rx="9" fill="#2b5fd9"/>
<text x="475" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">CUGA</text>
<line x1="653" y1="142" x2="653" y2="696" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="572" y="96" width="162" height="46" rx="9" fill="#8a8785"/>
<text x="653" y="122" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Provider</text>
<text x="653" y="137" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">(Google/GitHub)</text>
<line x1="831" y1="142" x2="831" y2="696" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="750" y="96" width="162" height="46" rx="9" fill="#b06f10"/>
<text x="831" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Activepieces</text>
<text x="297.0" y="152" font-size="12" fill="#1c1b1a" text-anchor="middle">Studio → Connect  (GET /api/events/connect/github)</text>
<line x1="119" y1="160" x2="468" y2="160" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="386.0" y="204" font-size="12" fill="#1c1b1a" text-anchor="middle">302 → provider consent (client_id, scopes, redirect_uri)</text>
<line x1="475" y1="212" x2="304" y2="212" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="475.0" y="256" font-size="12" fill="#1c1b1a" text-anchor="middle">you approve  (scopes: repo, admin:repo_hook)</text>
<line x1="297" y1="264" x2="646" y2="264" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="564.0" y="308" font-size="12" fill="#1c1b1a" text-anchor="middle">redirect → /connect/github/callback?code=…</text>
<line x1="653" y1="316" x2="482" y2="316" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<rect x="30" y="352" width="1234" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="647" y="372" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 CUGA receives an authorization CODE, never a token</text>
<text x="653.0" y="404" font-size="12" fill="#1c1b1a" text-anchor="middle">ensure_oauth_connection(code, client_id/secret, redirect)</text>
<line x1="475" y1="412" x2="824" y2="412" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="742.0" y="456" font-size="12" fill="#1c1b1a" text-anchor="middle">exchange code → access + refresh token</text>
<line x1="831" y1="464" x2="660" y2="464" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<path d="M831,510 h34 v20 h-34" fill="none" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="871" y="516" font-size="12" fill="#1c1b1a">store OAUTH2 connection  ea::tenant::user::github</text>
<rect x="30" y="552" width="1234" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="647" y="572" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 the token lives in AP only — CUGA and the agent never see it</text>
<rect x="30" y="596" width="1234" height="30" rx="6" fill="#f4f3f1" stroke="#7a3fa8" stroke-opacity="0.55"/>
<text x="647" y="616" font-size="12" fill="#7a3fa8" text-anchor="middle" font-style="italic">token apps (telegram/discord): paste a secret → AP SECRET_TEXT connection</text>
</svg>