<svg xmlns="http://www.w3.org/2000/svg" width="772" height="564" viewBox="0 0 772 564" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="772" height="564" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1c1b1a">FIRE ③ — PUSH · GitHub (webhook trigger)</text>
<text x="30" y="58" font-size="13" fill="#8a8785">A repo event arrives via AP's tunnel. AP resolves the OAuth token in its sandbox; the agent gets content.</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker><marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#1c1b1a" stroke-width="1.2"/></marker></defs>
<line x1="119" y1="142" x2="119" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="38" y="96" width="162" height="46" rx="9" fill="#8a8785"/>
<text x="119" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">GitHub</text>
<line x1="297" y1="142" x2="297" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="216" y="96" width="162" height="46" rx="9" fill="#b06f10"/>
<text x="297" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Activepieces</text>
<line x1="475" y1="142" x2="475" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="394" y="96" width="162" height="46" rx="9" fill="#2b5fd9"/>
<text x="475" y="122" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">CUGA</text>
<text x="475" y="137" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">/invoke</text>
<line x1="653" y1="142" x2="653" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="572" y="96" width="162" height="46" rx="9" fill="#1a7f4b"/>
<text x="653" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">pr_reviewer</text>
<text x="208.0" y="152" font-size="12" fill="#1c1b1a" text-anchor="middle">PR opened → webhook POST (to AP's public tunnel)</text>
<line x1="119" y1="160" x2="290" y2="160" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="30" y="196" width="712" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="386" y="216" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 AP resolves {{connections['ea::…::github']}} → the token, in its sandbox</text>
<text x="386.0" y="248" font-size="12" fill="#1c1b1a" text-anchor="middle">POST /invoke {source:github, payload: title/body/diff}</text>
<line x1="297" y1="256" x2="468" y2="256" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="30" y="292" width="712" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="386" y="312" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 the agent receives PR CONTENT — never the credential</text>
<text x="564.0" y="344" font-size="12" fill="#1c1b1a" text-anchor="middle">worker_input = PR title + body + stats</text>
<line x1="475" y1="352" x2="646" y2="352" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="564.0" y="396" font-size="12" fill="#1c1b1a" text-anchor="middle">summary</text>
<line x1="653" y1="404" x2="482" y2="404" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<text x="386.0" y="448" font-size="12" fill="#1c1b1a" text-anchor="middle">200 → AP send-step delivers</text>
<line x1="475" y1="456" x2="304" y2="456" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
</svg>