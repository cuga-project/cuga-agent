<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1160" height="620" fill="#ffffff"/>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker></defs>
<text x="30" y="36" font-size="21" font-weight="700" fill="#1c1b1a">CUGA Events — the ACTION half</text>
<text x="30" y="58" font-size="13" fill="#8a8785">trigger ▸ /invoke ▸ agent ▸ ACTION step — the agent reasons, Activepieces acts, the agent holds no credentials</text>
<text x="30" y="92" font-size="12" font-weight="700" fill="#7a3fa8">ARM-TIME  (natural language → a standing flow)</text>
<rect x="30" y="104" width="176" height="74" rx="11" fill="#fff" stroke="#6b6866" stroke-width="1.5"/>
<text x="118.0" y="126" font-size="14" font-weight="700" fill="#1c1b1a" text-anchor="middle">Utterance</text>
<text x="118.0" y="145" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">“when I get an email,</text>
<text x="118.0" y="160" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">draft a reply”</text>
<rect x="250" y="104" width="250" height="74" rx="11" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="375.0" y="126" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Concierge</text>
<text x="375.0" y="145" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">trigger gate + ACTION gate</text>
<text x="375.0" y="160" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">verb-align · ask-till-legit</text>
<rect x="548" y="104" width="250" height="74" rx="11" fill="#f3effb" stroke="#5a3fa8" stroke-width="1.5"/>
<text x="673.0" y="126" font-size="14" font-weight="700" fill="#5a3fa8" text-anchor="middle">Registries (DATA)</text>
<text x="673.0" y="145" font-size="11.5" fill="#5a3fa8" fill-opacity="0.92" text-anchor="middle">triggers.py · actions.py</text>
<text x="673.0" y="160" font-size="11.5" fill="#5a3fa8" fill-opacity="0.92" text-anchor="middle">generated from live AP</text>
<rect x="846" y="104" width="284" height="74" rx="11" fill="#fff" stroke="#b06f10" stroke-width="1.5"/>
<text x="988.0" y="126" font-size="14" font-weight="700" fill="#1c1b1a" text-anchor="middle">AP flow (JSON)</text>
<text x="988.0" y="145" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">trigger ▸ /invoke ▸ [action]</text>
<text x="988.0" y="160" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">built by flows.py / ap_engine.py</text>
<line x1="206" y1="141" x2="250" y2="141" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="500" y1="141" x2="548" y2="141" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="524.0" y="135.0" font-size="11" fill="#1c1b1a" text-anchor="middle">validate</text>
<line x1="798" y1="141" x2="846" y2="141" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="822.0" y="135.0" font-size="11" fill="#1c1b1a" text-anchor="middle">arm</text>
<text x="580" y="196" font-size="11" font-weight="700" fill="#5a3fa8">3 gates (no silent failure):</text>
<text x="580" y="211" font-size="10.5" fill="#8a8785">deterministic build · AP validity gate · LLM intent-verify → all agree, or ASK</text>
<text x="30" y="250" font-size="12" font-weight="700" fill="#b06f10">FIRE-TIME  (the trigger fires → the action runs)</text>
<rect x="30" y="262" width="170" height="78" rx="11" fill="#fff" stroke="#8a8785" stroke-width="1.5"/>
<text x="115.0" y="284" font-size="14" font-weight="700" fill="#1c1b1a" text-anchor="middle">Trigger</text>
<text x="115.0" y="303" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">gmail new_email</text>
<text x="115.0" y="318" font-size="11.5" fill="#1c1b1a" fill-opacity="0.92" text-anchor="middle">(or github/box/…)</text>
<rect x="240" y="262" width="210" height="78" rx="11" fill="#b06f10" stroke="#b06f10" stroke-width="1.5"/>
<text x="345.0" y="284" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Activepieces</text>
<text x="345.0" y="303" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">fires the flow;</text>
<text x="345.0" y="318" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">resolves connections</text>
<rect x="490" y="262" width="210" height="78" rx="11" fill="#2b5fd9" stroke="#2b5fd9" stroke-width="1.5"/>
<text x="595.0" y="284" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">POST /invoke</text>
<text x="595.0" y="303" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">the one seam;</text>
<text x="595.0" y="318" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">normalised envelope</text>
<rect x="740" y="262" width="180" height="78" rx="11" fill="#1a7f4b" stroke="#1a7f4b" stroke-width="1.5"/>
<text x="830.0" y="284" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Agent (cuga)</text>
<text x="830.0" y="303" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">reasons over the event</text>
<text x="830.0" y="318" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">→ answer text</text>
<rect x="960" y="262" width="170" height="78" rx="11" fill="#b06f10" stroke="#b06f10" stroke-width="1.5"/>
<text x="1045.0" y="284" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ACTION step</text>
<text x="1045.0" y="303" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">gmail reply/draft/send</text>
<text x="1045.0" y="318" font-size="11.5" fill="#fff" fill-opacity="0.92" text-anchor="middle">{{step_1.body.answer}}</text>
<line x1="200" y1="301" x2="240" y2="301" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="301" x2="490" y2="301" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="700" y1="301" x2="740" y2="301" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="720.0" y="295.0" font-size="11" fill="#1c1b1a" text-anchor="middle">text</text>
<line x1="920" y1="301" x2="960" y2="301" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="940.0" y="295.0" font-size="11" fill="#1c1b1a" text-anchor="middle">answer</text>
<rect x="360" y="430" width="440" height="66" rx="11" fill="#f3effb" stroke="#5a3fa8" stroke-width="1.5"/>
<text x="580.0" y="452" font-size="14" font-weight="700" fill="#5a3fa8" text-anchor="middle">resolve_action  (tool-first, AP-fallback)</text>
<text x="580.0" y="471" font-size="11.5" fill="#5a3fa8" fill-opacity="0.92" text-anchor="middle">agent already has a matching tool? → it acts in-run.</text>
<text x="580.0" y="486" font-size="11.5" fill="#5a3fa8" fill-opacity="0.92" text-anchor="middle">else → append this AP action step (the default).</text>
<line x1="1045" y1="340" x2="1045" y2="500" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="1045" y1="500" x2="800" y2="463" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="540" width="1100" height="52" rx="9" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.5"/>
<text x="580.0" y="562" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="700">🔑  The agent never holds a credential.</text>
<text x="580.0" y="580" font-size="11.5" fill="#c0392b" text-anchor="middle">AP owns the trigger AND the action connection ({{connections[…]}}), resolved inside AP’s sandbox at fire time. Adding a piece = regenerate registry rows, no new code.</text>
</svg>