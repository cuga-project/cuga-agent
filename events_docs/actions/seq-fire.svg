<svg xmlns="http://www.w3.org/2000/svg" width="820" height="616" viewBox="0 0 820 616" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="820" height="616" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1c1b1a">Fire-time — the email arrives, the action runs</text>
<text x="30" y="58" font-size="13" fill="#8a8785">one seam (/invoke); the agent answers; AP runs the Gmail action step with that answer</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker><marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#1c1b1a" stroke-width="1.2"/></marker></defs>
<line x1="125" y1="142" x2="125" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="38" y="96" width="174" height="46" rx="9" fill="#8a8785"/>
<text x="125" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Gmail</text>
<line x1="315" y1="142" x2="315" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="228" y="96" width="174" height="46" rx="9" fill="#b06f10"/>
<text x="315" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Activepieces</text>
<line x1="505" y1="142" x2="505" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="418" y="96" width="174" height="46" rx="9" fill="#2b5fd9"/>
<text x="505" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">POST /invoke</text>
<line x1="695" y1="142" x2="695" y2="592" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="608" y="96" width="174" height="46" rx="9" fill="#1a7f4b"/>
<text x="695" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Agent (cuga)</text>
<text x="220.0" y="152" font-size="12" fill="#1c1b1a" text-anchor="middle">new email (polling trigger)</text>
<line x1="125" y1="160" x2="308" y2="160" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="410.0" y="204" font-size="12" fill="#1c1b1a" text-anchor="middle">envelope: event.payload (+_raw)</text>
<line x1="315" y1="212" x2="498" y2="212" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="600.0" y="256" font-size="12" fill="#1c1b1a" text-anchor="middle">run once on this event</text>
<line x1="505" y1="264" x2="688" y2="264" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="600.0" y="308" font-size="12" fill="#1c1b1a" text-anchor="middle">answer text (the reply body)</text>
<line x1="695" y1="316" x2="512" y2="316" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<text x="410.0" y="360" font-size="12" fill="#1c1b1a" text-anchor="middle">answer → {{step_1.body.answer}}</text>
<line x1="505" y1="368" x2="322" y2="368" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<path d="M315,414 h34 v20 h-34" fill="none" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="355" y="420" font-size="12" fill="#1c1b1a">run reply_to_email step</text>
<rect x="30" y="456" width="760" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.55"/>
<text x="410" y="476" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">🔑 AP resolves the gmail connection in its sandbox — the agent saw no token</text>
<text x="220.0" y="508" font-size="12" fill="#1c1b1a" text-anchor="middle">create the reply / draft</text>
<line x1="315" y1="516" x2="132" y2="516" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
</svg>