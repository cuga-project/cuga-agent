apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-mcp-server
  namespace: ${NAMESPACE}
data:
  server.py: |
    # Tiny demo MCP server for the MCPCF PoC (poc-plan.md Track A).
    # Runs on the CUGA image — fastmcp is already a dependency there, so no
    # new image build is needed for this piece.
    from fastmcp import FastMCP

    mcp = FastMCP("mcpcf-demo")


    @mcp.tool
    def echo(text: str) -> str:
        """Echo the input back, prefixed — proves a round trip through Forge."""
        return f"demo-mcp says: {text}"


    @mcp.tool
    def add(a: float, b: float) -> float:
        """Add two numbers."""
        return a + b


    if __name__ == "__main__":
        mcp.run(transport="streamable-http", host="0.0.0.0", port=8080)
