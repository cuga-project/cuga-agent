apiVersion: v1
kind: Secret
metadata:
  name: forge-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
  BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
  # In-namespace service DNS — Forge's own Postgres/Redis (10-postgres,
  # 20-redis), not the tenant's shared Postgres.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@forge-postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@forge-redis:6379/0
