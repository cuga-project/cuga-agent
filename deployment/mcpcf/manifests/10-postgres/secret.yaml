apiVersion: v1
kind: Secret
metadata:
  name: forge-postgres
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  # sclorg/postgresql env var names — this image (unlike the vanilla
  # `postgres` Docker Hub one) supports OpenShift's arbitrary-UID `restricted-v2`
  # SCC out of the box, which is why the upstream Forge OpenShift guide's
  # `oc new-app` example uses it. See ../../README.md.
  POSTGRESQL_USER: ${POSTGRES_USER}
  POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRESQL_DATABASE: ${POSTGRES_DB}
