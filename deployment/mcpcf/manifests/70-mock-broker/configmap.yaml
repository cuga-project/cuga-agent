apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-broker
  namespace: ${NAMESPACE}
data:
  broker.py: |
    # PoC-only mock OIDC broker (poc-plan.md Track B, BROKER_MODE=mock).
    # Serves /.well-known/openid-configuration and /jwks from the same RSA
    # keypair 04-mint-token.sh signs tokens with — unblocks Option A without
    # the real IAM proxy emitting aud+groups. Runs on the CUGA image
    # (PyJWT[crypto] + cryptography are already dependencies there), stdlib
    # http.server only — no need for fastmcp/uvicorn for a handful of
    # static-ish JSON responses.
    import http.server
    import json
    import os

    from cryptography.hazmat.primitives import serialization
    from jwt.algorithms import RSAAlgorithm

    PRIV_KEY_PATH = "/etc/mock-broker/tls.key"
    ISSUER = os.environ["BROKER_ISSUER"]

    with open(PRIV_KEY_PATH, "rb") as f:
        private_key = serialization.load_pem_private_key(f.read(), password=None)
    public_key = private_key.public_key()

    jwk = json.loads(RSAAlgorithm.to_jwk(public_key))
    jwk.update(kid="mock-broker-1", use="sig", alg="RS256")
    JWKS = {"keys": [jwk]}
    OIDC_CONFIG = {
        "issuer": ISSUER,
        "jwks_uri": f"{ISSUER}/jwks",
        "response_types_supported": ["code", "id_token"],
        "subject_types_supported": ["public"],
        "id_token_signing_alg_values_supported": ["RS256"],
    }


    class Handler(http.server.BaseHTTPRequestHandler):
        def _json(self, obj, code=200):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/.well-known/openid-configuration":
                self._json(OIDC_CONFIG)
            elif self.path == "/jwks":
                self._json(JWKS)
            elif self.path == "/health":
                self._json({"status": "ok"})
            else:
                self._json({"error": "not found"}, 404)

        def log_message(self, fmt, *args):  # quiet — this is a PoC sidecar, not a service to debug via access logs
            pass


    if __name__ == "__main__":
        # Plain HTTPServer is single-connection — one client that doesn't
        # cleanly close (e.g. a killed curl) wedges every future request
        # forever, with nothing in the logs to explain it (confirmed live:
        # /jwks worked once, then /health itself stopped responding too).
        # ThreadingHTTPServer isolates each connection instead.
        http.server.ThreadingHTTPServer(("0.0.0.0", 8090), Handler).serve_forever()
