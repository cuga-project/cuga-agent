---
# Single-replica compliance PoC for OpenShift.
#
# Runs under the default `restricted-v2` SCC: no service-account binding, no
# elevated security context, no cluster-admin involvement. OpenShift assigns
# an arbitrary UID from the namespace range and a group-0 primary group, which
# is what the image is built for.
#
#   oc apply -f deployment/compliance-poc/openshift.yaml
#
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cuga-poc-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuga-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cuga-poc
  template:
    metadata:
      labels:
        app: cuga-poc
    spec:
      # No runAsUser and no fsGroup: OpenShift fills both from the namespace
      # range. Pinning either one is what breaks portability between clusters.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      # Service links inject CUGA_POC_PORT=tcp://... and friends, which collide
      # with the CUGA_ prefix the entrypoint forwards into service config.
      enableServiceLinks: false
      containers:
        - name: cuga-poc
          image: registry.example.com/cuga-compliance-poc:VERSION
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: ui
              containerPort: 7860
            - name: activepieces
              containerPort: 8081
            - name: evolve
              containerPort: 8201
          envFrom:
            - secretRef:
                name: cuga-poc-model-credentials
          volumeMounts:
            - name: data
              mountPath: /data
          # cuga-poc-health names the failing dependency on stdout, and
          # Kubernetes copies that into the probe's pod event, so the console
          # shows which service is down. Its curl budgets total ~33s worst
          # case; timeoutSeconds must stay above that or a slow-but-healthy
          # pod gets killed for taking too long to answer.
          startupProbe:
            exec:
              command: ["/usr/local/bin/cuga-poc-health"]
            periodSeconds: 40
            timeoutSeconds: 35
            failureThreshold: 23
          # Readiness is separate so a broken dependency takes the pod out of
          # the Route and shows as 0/1 Ready, rather than only ever presenting
          # as a restart loop.
          readinessProbe:
            exec:
              command: ["/usr/local/bin/cuga-poc-health"]
            periodSeconds: 40
            timeoutSeconds: 35
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["/usr/local/bin/cuga-poc-health"]
            periodSeconds: 60
            timeoutSeconds: 35
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 12Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cuga-poc-data
---
apiVersion: v1
kind: Service
metadata:
  name: cuga-poc
spec:
  selector:
    app: cuga-poc
  ports:
    - name: ui
      port: 7860
      targetPort: ui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cuga-poc
spec:
  to:
    kind: Service
    name: cuga-poc
  port:
    targetPort: ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
