---
# Single-replica compliance PoC for OpenShift.
#
# Runs under the default `restricted-v2` SCC: no service-account binding, no
# elevated security context, no cluster-admin involvement. OpenShift assigns
# an arbitrary UID from the namespace range and a group-0 primary group, which
# is what the image is built for.
#
#   oc apply -f deployment/compliance-poc/openshift.yaml
#
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cuga-poc-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuga-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cuga-poc
  template:
    metadata:
      labels:
        app: cuga-poc
    spec:
      # No runAsUser and no fsGroup: OpenShift fills both from the namespace
      # range. Pinning either one is what breaks portability between clusters.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      # Service links inject CUGA_POC_PORT=tcp://... and friends, which collide
      # with the CUGA_ prefix the entrypoint forwards into service config.
      enableServiceLinks: false
      containers:
        - name: cuga-poc
          image: registry.example.com/cuga-compliance-poc:VERSION
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: ui
              containerPort: 7860
            - name: activepieces
              containerPort: 8081
            - name: evolve
              containerPort: 8201
          envFrom:
            - secretRef:
                name: cuga-poc-model-credentials
          volumeMounts:
            - name: data
              mountPath: /data
          # A fresh volume spends 5-13 minutes importing the Activepieces
          # piece catalog. The startup probe owns that window so the liveness
          # probe can stay tight once the pod is serving.
          startupProbe:
            exec:
              command: ["/usr/local/bin/cuga-poc-health"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 45
          livenessProbe:
            exec:
              command: ["/usr/local/bin/cuga-poc-health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 12Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cuga-poc-data
---
apiVersion: v1
kind: Service
metadata:
  name: cuga-poc
spec:
  selector:
    app: cuga-poc
  ports:
    - name: ui
      port: 7860
      targetPort: ui
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cuga-poc
spec:
  to:
    kind: Service
    name: cuga-poc
  port:
    targetPort: ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
