<svg xmlns="http://www.w3.org/2000/svg" width="748" height="564" viewBox="0 0 748 564" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="748" height="564" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="700" fill="#1c1b1a">CRON / POLL — a scheduled flow fires</text>
<text x="30" y="58" font-size="13" fill="#8a8785">AP owns the trigger. Callback is podman-internal (HOST_CALLBACK_URL), NOT the tunnel.</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1c1b1a"/></marker><marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#1c1b1a" stroke-width="1.2"/></marker></defs>
<line x1="116" y1="142" x2="116" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="38" y="96" width="156" height="46" rx="9" fill="#b06f10"/>
<text x="116" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Activepieces</text>
<line x1="288" y1="142" x2="288" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="210" y="96" width="156" height="46" rx="9" fill="#2b5fd9"/>
<text x="288" y="122" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">CUGA</text>
<text x="288" y="137" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">/invoke</text>
<line x1="460" y1="142" x2="460" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="382" y="96" width="156" height="46" rx="9" fill="#1a7f4b"/>
<text x="460" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">worker</text>
<line x1="632" y1="142" x2="632" y2="540" stroke="#c9c6c1" stroke-width="1.4"/>
<rect x="554" y="96" width="156" height="46" rx="9" fill="#8a8785"/>
<text x="632" y="125" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Sink</text>
<path d="M116,154 h34 v20 h-34" fill="none" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="156" y="160" font-size="12" fill="#1c1b1a">schedule tick (every N min / cron)</text>
<text x="202.0" y="204" font-size="12" fill="#1c1b1a" text-anchor="middle">POST /invoke {agent, source:time/tick, deliver}</text>
<line x1="116" y1="212" x2="281" y2="212" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="374.0" y="256" font-size="12" fill="#1c1b1a" text-anchor="middle">runtime.run(...)</text>
<line x1="288" y1="264" x2="453" y2="264" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="374.0" y="308" font-size="12" fill="#1c1b1a" text-anchor="middle">answer</text>
<line x1="460" y1="316" x2="295" y2="316" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<text x="202.0" y="360" font-size="12" fill="#1c1b1a" text-anchor="middle">200 {answer}</text>
<line x1="288" y1="368" x2="123" y2="368" stroke="#1c1b1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwo)"/>
<text x="374.0" y="412" font-size="12" fill="#1c1b1a" text-anchor="middle">AP send-step  {{step_1.body.answer}}</text>
<line x1="116" y1="420" x2="625" y2="420" stroke="#1c1b1a" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="30" y="456" width="688" height="30" rx="6" fill="#f4f3f1" stroke="#7a3fa8" stroke-opacity="0.4"/>
<text x="374" y="476" font-size="12" fill="#7a3fa8" text-anchor="middle" font-style="italic">direct sink (Slack)? no send-step — CUGA delivers itself</text>
</svg>