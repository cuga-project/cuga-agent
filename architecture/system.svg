<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="1120" height="720" fill="#ffffff"/>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1c1b1a"/></marker></defs>
<text x="40" y="42" font-size="24" font-weight="700" fill="#1c1b1a">CUGA event-driven agents — system architecture</text>
<text x="40" y="66" font-size="13.5" fill="#8a8785">Every trigger, channel and integration normalises its event into an envelope and POSTs it to the one seam: /invoke.</text>
<rect x="40" y="100" width="232" height="120" rx="12" fill="#8a8785"/>
<text x="54" y="126" font-size="15" font-weight="700" fill="#fff">Channels (converse)</text>
<text x="54" y="146" font-size="12" fill="#fff" fill-opacity="0.92">web · slack* · discord* · telegram</text>
<text x="54" y="164" font-size="12" fill="#fff" fill-opacity="0.92">*direct backend (no AP)</text>
<text x="54" y="182" font-size="12" fill="#fff" fill-opacity="0.92">inbound: chat message → reply</text>
<rect x="40" y="236" width="232" height="120" rx="12" fill="#8a8785"/>
<text x="54" y="262" font-size="15" font-weight="700" fill="#fff">Integrations (watch/act)</text>
<text x="54" y="282" font-size="12" fill="#fff" fill-opacity="0.92">gmail (AP poll) · github (AP webhook)</text>
<text x="54" y="300" font-size="12" fill="#fff" fill-opacity="0.92">box (direct poll + download)</text>
<text x="54" y="318" font-size="12" fill="#fff" fill-opacity="0.92">generic webhook (no AP)</text>
<rect x="40" y="372" width="232" height="92" rx="12" fill="#8a8785"/>
<text x="54" y="398" font-size="15" font-weight="700" fill="#fff">Time</text>
<text x="54" y="418" font-size="12" fill="#fff" fill-opacity="0.92">cron / poll schedules</text>
<text x="54" y="436" font-size="12" fill="#fff" fill-opacity="0.92">(Activepieces schedule piece)</text>
<rect x="430" y="100" width="250" height="96" rx="12" fill="#2b5fd9"/>
<text x="444" y="126" font-size="15" font-weight="700" fill="#fff">Concierge  (NL → flow)</text>
<text x="444" y="146" font-size="12" fill="#fff" fill-opacity="0.92">POST /api/concierge</text>
<text x="444" y="164" font-size="12" fill="#fff" fill-opacity="0.92">classify + find_or_create_flow</text>
<text x="444" y="182" font-size="12" fill="#fff" fill-opacity="0.92">?flow=1 → returns the armed flow</text>
<rect x="430" y="250" width="250" height="120" rx="12" fill="#2b5fd9"/>
<text x="444" y="276" font-size="15" font-weight="700" fill="#fff">/invoke   ← the one seam</text>
<text x="444" y="296" font-size="12" fill="#fff" fill-opacity="0.92">envelope: {agent, source, event}</text>
<text x="444" y="314" font-size="12" fill="#fff" fill-opacity="0.92">X-Gateway-Token auth</text>
<text x="444" y="332" font-size="12" fill="#fff" fill-opacity="0.92">runtime.run(agent) · deliver</text>
<text x="444" y="350" font-size="12" fill="#fff" fill-opacity="0.92">meta.mcp = tools actually used</text>
<rect x="430" y="420" width="250" height="96" rx="12" fill="#1a7f4b"/>
<text x="444" y="446" font-size="15" font-weight="700" fill="#fff">Worker fleet (18 agents)</text>
<text x="444" y="466" font-size="12" fill="#fff" fill-opacity="0.92">pricebot · mailbot · resume_judge …</text>
<text x="444" y="484" font-size="12" fill="#fff" fill-opacity="0.92">each = prompt + MCP tools + access</text>
<text x="444" y="502" font-size="12" fill="#fff" fill-opacity="0.92">runs its own DynamicAgentGraph</text>
<rect x="430" y="552" width="250" height="84" rx="12" fill="#1a7f4b"/>
<text x="444" y="578" font-size="15" font-weight="700" fill="#fff">MCP tool servers</text>
<text x="444" y="598" font-size="12" fill="#fff" fill-opacity="0.92">finance · geo · web · knowledge</text>
<text x="444" y="616" font-size="12" fill="#fff" fill-opacity="0.92">code · text  (the agents' hands)</text>
<rect x="812" y="150" width="268" height="200" rx="12" fill="#b06f10"/>
<text x="826" y="176" font-size="15" font-weight="700" fill="#fff">Activepieces (AP)</text>
<text x="826" y="196" font-size="12" fill="#fff" fill-opacity="0.92">owns triggers + all credentials</text>
<text x="826" y="214" font-size="12" fill="#fff" fill-opacity="0.92">schedule · gmail · github · telegram pieces</text>
<text x="826" y="232" font-size="12" fill="#fff" fill-opacity="0.92">connections: OAUTH2 / SECRET_TEXT</text>
<text x="826" y="250" font-size="12" fill="#fff" fill-opacity="0.92">calls back → HOST_CALLBACK_URL</text>
<text x="826" y="268" font-size="12" fill="#fff" fill-opacity="0.92">(podman-internal, not the tunnel)</text>
<text x="826" y="286" font-size="12" fill="#fff" fill-opacity="0.92">public tunnel = inbound webhooks only</text>
<text x="826" y="304" font-size="12" fill="#fff" fill-opacity="0.92">⚠ cloudflared tunnel is ephemeral</text>
<rect x="812" y="400" width="268" height="116" rx="12" fill="#2b5fd9"/>
<text x="826" y="426" font-size="15" font-weight="700" fill="#fff">Delivery</text>
<text x="826" y="446" font-size="12" fill="#fff" fill-opacity="0.92">direct adapter (Slack/Discord/Box)</text>
<text x="826" y="464" font-size="12" fill="#fff" fill-opacity="0.92">  delivery.is_direct(channel)</text>
<text x="826" y="482" font-size="12" fill="#fff" fill-opacity="0.92">OR AP send-step {{step_1.body.answer}}</text>
<text x="826" y="500" font-size="12" fill="#fff" fill-opacity="0.92">sink parsed from thread_id origin</text>
<line x1="272" y1="160" x2="430" y2="148" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="350" y="140" font-size="11.5" fill="#1c1b1a" text-anchor="middle">converse</text>
<line x1="272" y1="300" x2="430" y2="300" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="350" y="292" font-size="11.5" fill="#1c1b1a" text-anchor="middle">events</text>
<line x1="272" y1="410" x2="812" y2="250" stroke="#b06f10" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="560" y="372" font-size="11.5" fill="#b06f10" text-anchor="middle">arm schedule</text>
<line x1="680" y1="148" x2="812" y2="210" stroke="#b06f10" stroke-width="1.6" marker-end="url(#a)"/>
<text x="760" y="176" font-size="11.5" fill="#b06f10" text-anchor="middle">arm / reuse flow</text>
<line x1="812" y1="300" x2="680" y2="300" stroke="#b06f10" stroke-width="1.6" marker-end="url(#a)"/>
<text x="746" y="292" font-size="11.5" fill="#b06f10" text-anchor="middle">POST /invoke (callback)</text>
<line x1="555" y1="196" x2="555" y2="250" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="555" y1="370" x2="555" y2="420" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="555" y1="516" x2="555" y2="552" stroke="#1c1b1a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="470" x2="812" y2="460" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="750" y="452" font-size="11.5" fill="#2b5fd9" text-anchor="middle">answer</text>
<line x1="946" y1="400" x2="946" y2="356" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="520" font-size="12" font-weight="700" fill="#1c1b1a">Legend</text>
<rect x="40" y="531" width="14" height="14" rx="3" fill="#8a8785"/>
<text x="62" y="542" font-size="12" fill="#1c1b1a">external / source</text>
<rect x="40" y="553" width="14" height="14" rx="3" fill="#2b5fd9"/>
<text x="62" y="564" font-size="12" fill="#1c1b1a">CUGA</text>
<rect x="40" y="575" width="14" height="14" rx="3" fill="#1a7f4b"/>
<text x="62" y="586" font-size="12" fill="#1c1b1a">agents / tools</text>
<rect x="40" y="597" width="14" height="14" rx="3" fill="#b06f10"/>
<text x="62" y="608" font-size="12" fill="#1c1b1a">Activepieces</text>
</svg>