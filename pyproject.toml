[project]
name = "cuga"
version = "0.3.2"
description = "CUGA is an open-source generalist agent for the enterprise, supporting complex task execution on web and APIs, OpenAPI/MCP integrations, composable architecture, reasoning modes, and policy-aware features."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10, <3.15"
dependencies = [
    # >=1.3.9 fixes GHSA-gr75-jv2w-4656 (path traversal / sandbox escape in the file-search
    # middleware, <=1.3.8).
    # <1.3.15 because 1.3.15 changed what happens when the summary model call fails:
    # 1.3.9-1.3.14 return an "Error generating summary: ..." placeholder that we store as the
    # summary; 1.3.15 retries and then raises, which we turn into
    # RuntimeError("middleware_invocation_failed: ...") and fall back to keeping the last N
    # messages. Both drop the same older messages — what changes is the extra placeholder
    # message and the metrics (1.3.15 reports hard_truncation instead of success).
    # Capped only to keep a security bump from also changing behaviour; 1.3.9-1.3.14 carry the
    # fix without it. See _invoke_middleware in
    # cuga/backend/cuga_graph/utils/context_summarizer.py for the measured comparison.
    "langchain>=1.3.9,<1.3.15",
    "langchain-ibm>=0.3.9",
    "ibm-watsonx-ai>=1.5.13; python_version>='3.14'",  # 1.5.10 StrEnum.__init__ crashes on 3.14
    "langchain-openai>=1.1.14",  # GHSA-r7w7-9xr2-qq2r: image-token-counting SSRF guard bypassed via DNS rebinding
    "langchain-core>=1.3.3",  # GHSA-pjwx-r37v-7724: unsafe deserialization via broad load() allowlists (<=1.3.2)
    # GHSA-cq5v-8q36-5273 (OOB heap read) and related aiohttp parser issues fixed in 3.14.3+.
    "aiohttp>=3.14.3",
    "httpx",
    "docker",
    "langgraph",
    "markdownify",
    "uvicorn",
    "fastapi[standard]",
    "langfuse",
    "dynaconf>=3.2.13",
    "playwright>=1.59.0",  # CVE-2025-9611 (MCP origin/DNS rebinding), CVE-2025-59288 (browser download SSL)
    "browsergym-core==0.13.0",
    "python-dotenv",
    "loguru",
    # 1.28.1+ fixes GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58, GHSA-vj7q-gjh5-988w (task/session/WebSocket auth).
    # No upper bound: mcp 2.x is compatible after moving imports to standalone fastmcp.
    "mcp[cli]>=1.28.1",
    "psutil>=7.0.0",
    "typer>=0.15.3",
    "typer-slim>=0.15.3", # explicit: docling pulls typer meta-package which needs typer-slim
    # <4: fastmcp 4.0.0 is currently beta. Lift to >=4.0.0 once a stable release exists.
    # >=3.3.0 so the fastmcp/ package has exactly one owner. Up to 3.2.x the fastmcp
    # distribution ships the code itself; from 3.3.0 it is a meta-package that requires
    # fastmcp-slim[client,server]==<same version>, and fastmcp-slim ships the code.
    # arize-phoenix pulls pydantic-ai-slim[mcp] -> fastmcp-slim, so on 3.2.x we ended up with
    # two distributions writing the same fastmcp/ directory: whichever installed last won, and
    # uninstalling either deleted the shared directory. Same split as typer / typer-slim above.
    "fastmcp>=3.3.0,<4",
    # Authoritative harmony special-token vocabulary
    # (see cuga_graph.utils.harmony.harmony_special_tokens); avoids
    # hand-maintaining the list.
    "openai-harmony>=0.0.4",
    "langchain-mcp-adapters",
    "pyyaml>=6.0.3",
    "langchain-groq>=0.3.8",
    # 0.6+/0.7.0 publish cryptography<49, which blocks GHSA-g6cj-pr64-35w5 (needs cryptography>=50).
    # Stay on 0.5.x until langchain-litellm lifts that cap; ChatLiteLLM API used here is unchanged.
    "langchain-litellm>=0.5.1,<0.6",
    # 1.84.0+ fixes GHSA-4xpc-pv4p-pm3w (Host header auth bypass); 1.83.14 was prior floor for fastmcp compat.
    "litellm>=1.84.0",
    "tavily-python",
    "fastembed>=0.4.0",
    "a2a-sdk[http-server]>=0.3.22",
    "sqlite-vec>=0.1.6", # GHSA-vrcx-gx3g-j3h8 affects <0.1.3 only; 0.1.6 is safe
    "pgvector>=0.4.2",
    "asyncpg>=0.30",
    "PyJWT[crypto]>=2.13.0",  # GHSA-xgmm-8j9v-c9wx: JWK accepted as HMAC secret (<=2.12.x)
    # 50.0.0+ fixes GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher); 49+ also GHSA-jwv3-5hgf-82ww / GHSA-m2h6-j472-rp4c.
    "cryptography>=50.0.0",
    "hvac>=2.0.0",
    "boto3>=1.34.0",
    # Knowledge engine (replaces OpenRAG)
    "langchain-docling>=2.0,<3.0",
    # EasyOCR is the cross-platform safety net so OCR Just Works on a
    # fresh ``uv sync`` even when tesseract isn't on PATH. Tesseract
    # (system binary) is preferred when available — see
    # ``engine._select_ocr_engine_options``. Test
    # ``test_no_tesseract_falls_back_to_easyocr`` documents that this
    # fallback path must remain importable.
    "easyocr",
    # explicit: forces pytorch-cpu index via [tool.uv.sources], avoids 3.5GB nvidia-cuda wheels.
    # 2.13.0 fixes GHSA-rrmf-rvhw-rf47 (memory corruption in torch.jit.script, <=2.12.1).
    "torch>=2.13.0",
    "torchvision", # explicit: must match torch variant (cpu) to avoid operator registration errors
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.2",
    "toolguard>=0.2.17",
    "cuga-oak-health; python_version>='3.12'",
    "aiosmtpd",
]

[project.optional-dependencies]
evaluation = ["rapidfuzz"]
e2b = ["e2b-code-interpreter>=2.4.1"]
knowledge = []  # knowledge is now built-in, no extra dependencies needed
health = ["cuga-oak-health; python_version>='3.12'"]  # kept for backward compat, now also in core deps
opensandbox = ["opensandbox", "opensandbox-code-interpreter"]
evolve = ["altk-evolve>=1.1.0; python_version>='3.12'"]
# OpenLit (PyPI) pins openai<2; litellm 1.83.x needs openai 2.x — cannot both be core deps for pip/uvx.
# Note: When using observability extra, ensure python-dotenv>=1.1.0 is installed to avoid conflicts
observability = ["openlit>=1.40.3"]
# profiling-only — never a runtime dep. memray has no Windows or Python 3.14 wheels.
profiling = ["memray>=1.11; sys_platform != 'win32' and python_version < '3.14'"]

[project.urls]
Homepage = "https://cuga.dev"
Repository = "https://github.com/cuga-project/cuga-agent"

[tool.uv]
package = true
constraint-dependencies = [
    "pillow>=12.3.0",  # GHSA-62p4-gmf7-7g93 and related Pillow OOB/DoS CVEs in <=12.2.x
    "urllib3>=2.7.0",  # GHSA-qccp-gfcp-xxvc, GHSA-mf9v-mfxr-j63j (<=2.6.x); prior CVEs fixed in 2.6.3+
    "h11>=0.16.0",     # CVE-2025-43859: HTTP request smuggling via chunked encoding
    "setuptools>=83.0.0",  # GHSA-h35f-9h28-mq5c (MANIFEST.in bypass via Unicode NFC/NFD collision, <83); earlier GHSA-cx63-2mw6-8hw5, GHSA-5rjg-fvgr-3xxf
    # Security updates for transitive dependencies
    "authlib>=1.7.1",      # GHSA-r95x-qfjj-fjj2, GHSA-w8p2-r796-3vmq (OAuth/OIDC open redirect in 1.7.0); earlier GHSA-wvwj-cvrp-7pv5, GHSA-m344-f55w-2m6j, GHSA-7wc2-qxgw-g8gg, GHSA-7432-952r-cw78
    "idna>=3.15",          # GHSA-65pc-fj4g-8rjx: crafted input to idna.encode() bypasses the CVE-2024-3651 fix (<3.15)
    "orjson>=3.11.6",      # GHSA-hx9q-6w63-j58v
    "pyasn1>=0.6.4",       # GHSA-m4p7-r5rc-7g4j, GHSA-8ppf-4f7h-5ppj, GHSA-hm4w-wwcw-mr6r (DoS in <=0.6.3)
    "protobuf>=5.29.6",    # GHSA-7gcm-g887-7qv7
    # GHSA-fr49-mhgj-crfc (MaxAliasesLimiter bypass via fragment spreads), GHSA-qfwv-87qj-98xq
    # (circular fragment reference DoS), GHSA-x97m-qp5c-w9xj (GraphiQL leaks headers in URLs).
    # Earlier: auth bypass + DoS via unlimited WebSocket subscriptions (<=0.312.2).
    "strawberry-graphql>=0.315.7",
    # arize-phoenix hard-pins an exact strawberry-graphql, so it sets which strawberry we get:
    # <=16.3.0 pins the vulnerable 0.314.3, 16.4.0..17.12.0 pins 0.316.0, 17.13.0..17.30.0 pins
    # 0.319.0, 18.0.0+ pins 0.320.4.
    # >=17.13.0 because 16.4.0..17.10.0 ask for "pydantic-ai-slim>=1.95.0" with no upper bound
    # while their code still uses the 1.x API, so a resolver is free to install pydantic-ai 2.x
    # and phoenix then fails to import (MCPServerStreamableHTTP). pytest loads phoenix through
    # its pytest11 entry point, so that breaks collection for the whole suite. Upstream capped
    # it in 17.11.0 and moved to pydantic-ai 2.x in 17.13.0.
    "arize-phoenix>=17.13.0",
    "starlette>=1.3.1",       # GHSA-82w8-qh3p-5jfq (form DoS), GHSA-wqp7-x3pw-xc5r (UNC SSRF on Windows)
    "python-multipart>=0.0.30",  # GHSA-5rvq-cxj2-64vf (querystring DoS); GHSA-pp6c-gr5w-3c5g fixed in 0.0.27+
    "langsmith>=0.8.18",  # GHSA-f4xh-w4cj-qxq8: TracingMiddleware arbitrary file read (<=0.8.17)
    "langgraph-checkpoint>=4.1.1",  # GHSA-fjqc-hq36-qh5p: unsafe JSON deserialization when loading checkpoints
    "langgraph-sdk>=0.3.15",  # GHSA-w39p-vh2g-g8g5: unsafe URL path construction
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j: NestedSecretsSettingsSource follows symlinks out of secrets_dir
    "langchain-classic>=1.0.7",  # GHSA-3644-q5cj-c5c7: untrusted prompt manifest deserialization (<=1.0.6)
    "docling>=2.94.0",  # GHSA-q29v-xc37-wh5m: unsafe URI/path handling in HTML backend (<=2.93.x)
    "mako>=1.3.12",           # GHSA-v92g-xgxw-vvmm (// path traversal, <=1.3.10), GHSA-2h4p-vjrc-8xpq (Windows \\ traversal, <=1.3.11)
    "soupsieve>=2.8.4",  # GHSA-2wc2-fm75-p42x, GHSA-836r-79rf-4m37 (memory / ReDoS in <=2.8.3)
    "joserfc>=1.6.8",  # GHSA-gg9x-qcx2-xmrh: empty/nil HMAC key accepted for HS* verify (<=1.6.7)
    "json-repair>=0.60.1",  # GHSA-xf7x-x43h-rpqh: circular JSON Schema $ref DoS (<=0.60.0)
    "datamodel-code-generator>=0.64.0",  # GHSA-5578-w22f-pfx9 and related code-injection / SSRF / path-read CVEs
]
# litellm 1.83.4 pins python-dotenv==1.0.1; fastmcp needs >=1.1.0 — allow newer for sync/lock only.
override-dependencies = ["python-dotenv>=1.1.0"]

[tool.uv.sources]
torch                 = { index = "pytorch-cpu" }
torchvision           = { index = "pytorch-cpu" }
torchaudio            = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# NOTE: uv.lock includes graphql-core 3.3.0a12 (pre-release) to fix strawberry-graphql security vulnerability
# RISK ACCEPTED: graphql-core pre-release required by arize-phoenix 14.3.1+ for secure strawberry-graphql
# - Lock file generated with: uv lock --upgrade-package strawberry-graphql --upgrade-package arize-phoenix --prerelease=allow
# - graphql-core is mature; alpha is for new features, not instability
# - Monitor for graphql-core 3.3.0 stable release to remove pre-release dependency

# PyPI openlit declares openai<2; litellm 1.83.x needs openai 2.x. Override for uv lock / Docker / dev only.
[[tool.uv.dependency-metadata]]
name = "openlit"
version = "1.40.3"
requires-dist = [
    "anthropic>=0.42.0,<1.0.0",
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    "openai>=1.1.1,<3.0.0",
    "opentelemetry-api>=1.38.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.38.0,<2.0.0",
    "opentelemetry-instrumentation>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-asgi>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-django>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-falcon>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-fastapi>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-flask>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-pyramid>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-requests>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-starlette>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-tornado>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-urllib>=0.52b0,<1.0.0",
    "opentelemetry-instrumentation-urllib3>=0.52b0,<1.0.0",
    "opentelemetry-sdk>=1.38.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.59b0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.26.0,<3.0.0",
    "schedule>=1.2.2,<2.0.0",
    "xmltodict>=0.13.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "frontend_workspaces*"
]

[tool.setuptools.package-data]
cuga = [
    "configurations/**/*.toml",
    "configurations/**/*.md",
    "settings.toml",
    "backend/**/*.jinja2",
    "backend/cuga_graph/nodes/cuga_lite/prompts/*.json",
    "backend/**/*.js",
    "backend/server/demo_setup_utils/*.json",
    "backend/observability/assets/*.json",
    "frontend/dist/**",
    "demo_tools/**",
]
scripts = ["*.py"]
system_tests = ["**/*.py", "**/*.yaml", "**/*.sh"]



[project.scripts]
load_specs = "scripts.api_utils.load_openapi_specs:main"
demo = "scripts.commands:run_demo"
registry = "scripts.commands:run_api_registry"
registry_appworld = "scripts.commands:run_api_registry_appworld"

graph = "scripts.draw_graph:main"
eval_api = "scripts.commands:run_eval_api"
appworld_eval = "evaluation.appworld_eval:run_main"
appworld_setup = "scripts.commands:setup_appworld_environment"
appworld_setup_docker = "scripts.commands:setup_appworld_environment_docker"
cuga = "cuga.cli:app"
code = "evaluation.code_generator:main"
exp = "scripts.eval_gui:main"
digital_sales_mcp = "scripts.commands:run_digital_sales_mcp"
digital_sales_openapi = "scripts.commands:run_digital_sales_openapi"
test_llm = "scripts.commands:test_llm"

[dependency-groups]
dev = [
    "pytz>=2025.1",
    "ruff>=0.9.4",
    "tabulate",
    "beartype",
    "nltk>=3.10.0",  # GHSA-p4gq-832x-fm9v and related path traversal / ReDoS / SSRF in <=3.9.x
    "termcolor",
    "rapidfuzz",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.1.0",
    "pytest-xdist>=3.6.1",
    "cugaviz",
    "pre-commit>=4.3.0",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "pip-licenses>=5.5.1",
]
google-genai = [
    "langchain-google-genai>=2.0.11",
]
sandbox = [
    "llm-sandbox>=0.1.3",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/cuga/backend",
    "src/cuga/sdk_core",
    "src/system_tests",
]
python_files = ["test_*.py", "*_test.py", "*_test_*.py", "load_test*.py"]
python_classes = ["Test*"]
addopts = ["-ra", "--strict-markers", "-m", "not manual and not pgvector", "--import-mode=importlib"]
asyncio_mode = "auto"
norecursedirs = [".git", ".tox", "dist", "build", "docs", "frontend_workspaces"]
markers = [
    "e2e: live external services / full agent stack",
    "slow: long-running integration tests",
    "unit: fast isolated tests",
    "pgvector: requires CUGA_KNOWLEDGE_PGVECTOR_CONNECTION_STRING",
    "load: concurrent load tests (honors --load-test-users)",
    "stability: LLM-backed e2e stability suite (src/system_tests/e2e)",
    "windows_smoke: Windows CI smoke subset of stability tests",
    "manual: requires manually started services; excluded from default collection",
]
