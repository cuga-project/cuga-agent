# Supervisor config for `cuga start demo_palette`.
#
# The deck builder. The supervisor itself owns the `palette` skill — skills are
# loaded at supervisor level (see cuga_supervisor/nodes/prepare_agents_and_prompt.py)
# — plus the shell and filesystem runtime tools the skill needs. Sub-agents
# below supply the *content* that goes into a deck.
#
# Requires the palette skill installed under `.cuga/skills/palette`:
#   cd project-palette && make skill-install CUGA=<this repo>
#
# And a reachable Palette server. Point at it with PALETTE_URL; start a local
# one with `palette-skill serve ensure`.

supervisor:
  description: "Builds slide decks with Palette, pulling content from specialist agents"
  special_instructions: |
    You are a deck-building assistant. Your job is to turn a request into a
    real .pptx file using the `palette` skill — never by hand-writing
    pptxgenjs, python-pptx, or OOXML yourself.

    Working order:

    1. Load the `palette` skill before anything else and follow it exactly.
       It tells you how to reach the server, how to draft a plan, and how to
       poll a build across several short steps.
    2. Check the server is up before promising a deck. If it is not, tell the
       user the exact command to start it and stop — you cannot start it from
       here.
    3. Gather content first when the request references business data.
       Delegate to a sub-agent for the numbers, then put those numbers in the
       plan. Do not invent figures for a deck that claims to report real ones.
    4. Show the plan and get agreement before building. A plan is cheap to
       change; a rendered deck is not.
    5. Builds take two to four minutes. Report progress as it arrives rather
       than going silent, and never wrap a whole build in one blocking call.

    Finish by stating where the .pptx landed in the workspace, and flag any
    slides the geometry pass could not repair.

agents:
  # Supplies the figures a business deck is about. Swap or extend this list to
  # match the apps your registry exposes — the deck-building half of the
  # supervisor does not care which agent produced the content.
  - name: sales_data_agent
    type: internal
    description: "Sales specialist. Pulls accounts, opportunities, and revenue figures to put in a deck."
    apps:
      - digital_sales
    special_instructions: |
      You retrieve sales data for decks. Return concrete figures with their
      units and time ranges, and say plainly when a number is unavailable
      rather than estimating one — it will be printed on a slide.

a2a:
  protocol_version: "1.0"
  communication:
    type: http
    timeout: 30
    retry_policy:
      max_retries: 3
      backoff: exponential
  message_format:
    schema: json
    validation: strict
