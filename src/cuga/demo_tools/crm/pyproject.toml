[project]
name = "crm-system-api"
version = "1.1.5"
description = "A comprehensive FastAPI-based CRM system with Accounts, Leads, Contacts, and Opportunities management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "pydantic[email]>=2.5.0",
    "python-multipart>=0.0.27",
    "passlib[bcrypt]>=1.7.0",
    "faker>=20.1.0",
    "fastmcp>=3.2.0",
]

[project.scripts]
crm-server = "crm_api.main:main"
crm-mcp = "crm_api.wrap_as_mcp:main"
crm = "crm_api.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crm_api"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "faker>=20.1.0",
]
constraint-dependencies = [
    "starlette>=1.3.1",
    "python-multipart>=0.0.27",
    "mako>=1.3.11",
    "pyasn1>=0.6.3",
    "pyjwt[crypto]>=2.12.0",
]
