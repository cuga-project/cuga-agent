<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Table designer</title>
<style>
  :root {
    --bg: #ffffff;
    --layer: #f4f4f4;
    --layer-2: #e8e8e8;
    --field: #f4f4f4;
    --border: #e0e0e0;
    --border-strong: #8d8d8d;
    --text: #161616;
    --text-2: #525252;
    --text-3: #6f6f6f;
    --interactive: #0f62fe;
    --interactive-hover: #0050e6;
    --interactive-active: #002d9c;
    --focus: #0f62fe;
    --danger: #da1e28;
    --danger-bg: #fff1f1;
    --success: #24a148;
    --success-bg: #defbe6;
    --tag-blue-bg: #d0e2ff; --tag-blue: #0043ce;
    --tag-green-bg: #a7f0ba; --tag-green: #0e6027;
    --tag-purple-bg: #e8daff; --tag-purple: #6929c4;
    --tag-red-bg: #ffd7d9; --tag-red: #a2191f;
    --code-bg: #262626; --code-text: #f4f4f4;
    --radius: 4px;
    --font: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #161616;
    --layer: #262626;
    --layer-2: #393939;
    --field: #262626;
    --border: #393939;
    --border-strong: #6f6f6f;
    --text: #f4f4f4;
    --text-2: #c6c6c6;
    --text-3: #a8a8a8;
    --interactive: #4589ff;
    --interactive-hover: #0f62fe;
    --interactive-active: #0043ce;
    --focus: #ffffff;
    --danger: #fa4d56;
    --danger-bg: #2d0709;
    --success: #42be65;
    --success-bg: #071908;
    --tag-blue-bg: #002d9c; --tag-blue: #d0e2ff;
    --tag-green-bg: #044317; --tag-green: #a7f0ba;
    --tag-purple-bg: #491d8b; --tag-purple: #e8daff;
    --tag-red-bg: #750e13; --tag-red: #ffd7d9;
    --code-bg: #0b0b0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--text); font-size: 14px; line-height: 1.43; letter-spacing: 0.16px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px 20px 16px; }
  .eyebrow { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.32px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 400; margin: 0 0 6px; }
  .desc { color: var(--text-2); margin: 0 0 16px; max-width: 70ch; }

  /* Progress indicator */
  .steps { display: flex; gap: 0; margin: 0 0 20px; padding: 0; list-style: none; }
  .step { flex: 1; min-width: 0; border-top: 2px solid var(--border); padding-top: 8px; margin-right: 4px; display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 13px; }
  .step:last-child { margin-right: 0; }
  .step .dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .step.current { border-top-color: var(--interactive); color: var(--text); font-weight: 600; }
  .step.current .dot { border: 5px solid var(--interactive); }
  .step.complete { border-top-color: var(--interactive); color: var(--text-2); }
  .step.complete .dot { background: var(--interactive); border-color: var(--interactive); color: #fff; }

  /* Notifications */
  .notice { display: flex; gap: 10px; border-left: 3px solid var(--danger); background: var(--danger-bg); padding: 10px 12px; margin: 0 0 16px; border-radius: 0 var(--radius) var(--radius) 0; }
  .notice.success { border-left-color: var(--success); background: var(--success-bg); }
  .notice ul { margin: 2px 0 0; padding-left: 18px; }
  .notice strong { display: block; }

  /* Fields */
  .field { margin: 0 0 18px; }
  label.lbl, .lbl { display: block; font-size: 12px; color: var(--text-2); margin: 0 0 6px; letter-spacing: 0.32px; }
  .help { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .err-text { font-size: 12px; color: var(--danger); margin-top: 4px; }
  input[type="text"], select {
    font: inherit; color: var(--text); background: var(--field); border: none; border-bottom: 1px solid var(--border-strong);
    height: 38px; padding: 0 12px; width: 100%; border-radius: 0; outline: 2px solid transparent; outline-offset: -2px;
  }
  select { appearance: none; padding-right: 32px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
    background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input[type="text"]:focus, select:focus { outline-color: var(--focus); }
  input[aria-invalid="true"] { outline-color: var(--danger); }
  .w-name { max-width: 360px; }

  /* Columns editor */
  .grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .grid th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text); background: var(--layer-2); padding: 8px 8px; }
  .grid td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; background: var(--layer); }
  .grid td.num { color: var(--text-3); font-variant-numeric: tabular-nums; width: 36px; }
  .grid input[type="text"], .grid select { height: 32px; background: var(--bg); }
  .grid select { padding: 0 26px 0 8px; font-size: 13px; background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px; }
  .grid .c-num { width: 32px; } .grid .c-type { width: 160px; } .grid .c-flag { width: 64px; text-align: center; } .grid .c-del { width: 40px; }
  .grid th.flag { text-align: center; line-height: 1.2; }
  .namecell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .namecell input { flex: 1 1 auto; min-width: 0; }
  .namecell .tag { flex: none; }
  .grid td.flag { text-align: center; }
  .grid tr.is-new td { background: color-mix(in srgb, var(--tag-green-bg) 35%, var(--layer)); }
  .grid tr.is-changed td { background: color-mix(in srgb, var(--tag-blue-bg) 35%, var(--layer)); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--interactive); cursor: pointer; }
  input[type="checkbox"]:disabled { cursor: not-allowed; opacity: .5; }
  .row-err td { border-bottom-color: var(--danger); }
  .row-err-msg td { background: transparent; border-bottom: none; padding-top: 0; }

  /* Tags */
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .tag.blue { background: var(--tag-blue-bg); color: var(--tag-blue); }
  .tag.green { background: var(--tag-green-bg); color: var(--tag-green); }
  .tag.purple { background: var(--tag-purple-bg); color: var(--tag-purple); }
  .tag.red { background: var(--tag-red-bg); color: var(--tag-red); }
  .tag.gray { background: var(--layer-2); color: var(--text-2); }

  /* Buttons */
  .btn { font: inherit; font-size: 14px; height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-width: 120px; justify-content: space-between; outline: 2px solid transparent; outline-offset: -4px; }
  .btn:focus-visible { outline-color: var(--bg); box-shadow: inset 0 0 0 2px var(--focus); }
  .btn.primary { background: var(--interactive); color: #fff; }
  .btn.primary:hover { background: var(--interactive-hover); }
  .btn.primary:active { background: var(--interactive-active); }
  .btn.secondary { background: #393939; color: #fff; }
  .btn.secondary:hover { background: #4c4c4c; }
  .btn.ghost { background: transparent; color: var(--interactive); min-width: 0; padding: 0 12px; justify-content: flex-start; }
  .btn.ghost:hover { background: var(--layer); }
  .btn[disabled] { background: var(--layer-2); color: var(--text-3); cursor: not-allowed; }
  .icon-btn { background: transparent; border: none; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-2); border-radius: 0; }
  .icon-btn:hover { background: var(--layer-2); color: var(--danger); }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
  .actions { display: flex; justify-content: flex-end; gap: 1px; margin-top: 20px; flex-wrap: wrap; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 8px; flex-wrap: wrap; }
  .count { font-size: 12px; color: var(--text-3); }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Review */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 0 0 18px; }
  .tile { background: var(--layer); padding: 12px; }
  .tile .k { font-size: 12px; color: var(--text-3); }
  .tile .v { font-size: 18px; line-height: 24px; margin-top: 2px; word-break: break-word; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .section { margin: 0 0 18px; }
  .changes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .changes li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .changes code, .mono { font-family: var(--mono); font-size: 13px; }
  .empty { color: var(--text-3); font-style: italic; }
  pre.ddl { background: var(--code-bg); color: var(--code-text); font-family: var(--mono); font-size: 13px; line-height: 20px; padding: 14px 16px; margin: 0; overflow-x: auto; border-radius: var(--radius); }
  .ro td { background: var(--layer); overflow-wrap: anywhere; }

  /* Done */
  .done { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .done svg { flex: none; color: var(--success); }

  /* Skeleton */
  .skel { background: linear-gradient(90deg, var(--layer) 25%, var(--layer-2) 50%, var(--layer) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 2px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  @media (prefers-reduced-motion: reduce) { .spinner, .skel { animation: none; } }
  @media (max-width: 520px) { .grid .c-type { width: 136px; } .namecell .tag { display: none; } }
</style>
</head>
<body>
<main id="root" class="card" aria-live="polite" aria-busy="true">
  <div class="skel" style="height:12px;width:120px;margin-bottom:10px"></div>
  <div class="skel" style="height:24px;width:60%;margin-bottom:16px"></div>
  <div class="skel" style="height:38px;width:100%;margin-bottom:8px"></div>
  <div class="skel" style="height:120px;width:100%"></div>
</main>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script>/*__EXT_APPS_BUNDLE__*/</script>
<script>
(() => {
  "use strict";
  const { App } = globalThis.McpExtApps;
  const root = document.getElementById("root");
  const statusEl = document.getElementById("status");

  const state = {
    form: null,          // current server-provided form spec
    values: {},          // edit view values
    baseline: [],        // columns as first proposed (for "new"/"changed" markers)
    busy: null,          // id of the action in flight
    errors: [],          // server or call errors to show at the top
    touched: false,      // show client validation after the first submit attempt
    completed: null,     // completion payload once the user accepted
  };

  // ---------- tiny DOM helper ----------
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v === null || v === undefined) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const svg = (path, size = 16) => {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 32 32");
    s.setAttribute("fill", "currentColor"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = path; return s;
  };
  const ICON_TRASH = '<path d="M12 12h2v12h-2zM18 12h2v12h-2z"/><path d="M4 6v2h2v20a2 2 0 002 2h16a2 2 0 002-2V8h2V6zm4 22V8h16v20zM12 2h8v2h-8z"/>';
  const ICON_ADD = '<path d="M17 15V8h-2v7H8v2h7v7h2v-7h7v-2z"/>';
  const ICON_DONE = '<path d="M16 2a14 14 0 1014 14A14 14 0 0016 2zm-2 19.59l-5-5L10.59 15 14 18.41 21.41 11l1.6 1.59z"/>';
  const ICON_TABLE = '<path d="M29 5a2 2 0 00-2-2H5a2 2 0 00-2 2v22a2 2 0 002 2h22a2 2 0 002-2zm-2 0v4H5V5zM5 11h6v7H5zm0 16v-7h6v7zm8 0v-7h14v7zm14-9H13v-7h14z"/>';
  const mount = (...nodes) => root.replaceChildren(...nodes.flat().filter((n) => n !== null && n !== undefined && n !== false));
  const announce = (msg) => { statusEl.textContent = ""; setTimeout(() => { statusEl.textContent = msg; }, 30); };

  // ---------- validation (mirrors the server; the server stays authoritative) ----------
  function validateEdit() {
    const f = state.form; if (!f) return { table: null, rows: {}, all: [] };
    const pattern = new RegExp((f.fields.find(x => x.id === "table_name") || {}).pattern || "^.+$");
    const colPattern = new RegExp((f.fields.find(x => x.id === "columns") || {}).pattern || "^.+$");
    const out = { table: null, rows: {}, all: [] };
    const t = (state.values.table_name || "").trim();
    if (!t) out.table = "Enter a table name.";
    else if (!pattern.test(t)) out.table = "Use lowercase letters, digits and underscores; start with a letter.";
    const seen = new Map();
    (state.values.columns || []).forEach((c, i) => {
      const name = (c.name || "").trim();
      let msg = null;
      if (!name) msg = "Enter a column name.";
      else if (!colPattern.test(name)) msg = "Invalid name: lowercase letters, digits and underscores.";
      else if (seen.has(name)) msg = `“${name}” is already used by column ${seen.get(name) + 1}.`;
      if (!seen.has(name)) seen.set(name, i);
      if (msg) out.rows[i] = msg;
    });
    const cols = state.values.columns || [];
    if (!cols.length) out.all.push("Add at least one column.");
    else if (!cols.some(c => c.primary_key)) out.all.push("Mark one column as the primary key.");
    return out;
  }
  const isValid = (v) => !v.table && !Object.keys(v.rows).length && !v.all.length;

  // ---------- rendering ----------
  function header(f) {
    const steps = f.steps || [];
    return [
      h("p", { class: "eyebrow" }, svg(ICON_TABLE, 14), f.eyebrow || "Form"),
      h("h1", { id: "form-title", text: f.title || "" }),
      f.description ? h("p", { class: "desc", text: f.description }) : null,
      steps.length ? h("ol", { class: "steps", "aria-label": "Progress" },
        steps.map((s, i) => {
          const cls = i < f.step_index ? "complete" : i === f.step_index ? "current" : "";
          return h("li", { class: `step ${cls}`, "aria-current": i === f.step_index ? "step" : null },
            h("span", { class: "dot" }, i < f.step_index ? "✓" : ""), h("span", { text: s }));
        })) : null,
    ];
  }

  function errorNotice(list) {
    if (!list || !list.length) return null;
    return h("div", { class: "notice", role: "alert" },
      h("div", {}, h("strong", { text: list.length === 1 ? "Fix this to continue" : `Fix these ${list.length} issues to continue` }),
        h("ul", {}, list.map(e => h("li", { text: e })))));
  }

  function actionButtons(f, validity) {
    return h("div", { class: "actions" }, (f.actions || []).map(a => {
      const busy = state.busy === a.id;
      const disabled = !!state.busy || (a.include_fields && state.touched && validity && !isValid(validity));
      return h("button", {
        type: "button", class: `btn ${a.kind || "secondary"}`, disabled: disabled ? true : null,
        "aria-busy": busy ? "true" : null, onclick: () => runAction(a),
      }, busy ? (a.busy_label || "Working…") : a.label, busy ? h("span", { class: "spinner", "aria-hidden": "true" }) : null);
    }));
  }

  function renderEdit(f) {
    const v = state.touched ? validateEdit() : { table: null, rows: {}, all: [] };
    const tableField = f.fields.find(x => x.id === "table_name");
    const colField = f.fields.find(x => x.id === "columns");
    const cols = state.values.columns;
    const baselineByName = new Map(state.baseline.map(c => [c.name, c]));

    const tableInput = h("input", {
      id: "f-table", type: "text", class: "w-name", value: state.values.table_name, autocomplete: "off", spellcheck: "false",
      "aria-invalid": v.table ? "true" : null, "aria-describedby": "f-table-help",
      oninput: (e) => { state.values.table_name = e.target.value; if (state.touched) refreshValidation(); },
    });

    const rows = [];
    cols.forEach((c, i) => {
      const base = state.baseline[i];
      const known = baselineByName.get(c.name);
      let tag = null, rowCls = "";
      if (!base) { tag = h("span", { class: "tag green", text: "New" }); rowCls = "is-new"; }
      else if (!known) { tag = h("span", { class: "tag blue", text: "Renamed" }); rowCls = "is-changed"; }
      else if (known.type !== c.type || known.nullable !== c.nullable || known.primary_key !== c.primary_key) {
        tag = h("span", { class: "tag purple", text: "Edited" }); rowCls = "is-changed";
      }
      const rowErr = v.rows[i];
      rows.push(h("tr", { class: `${rowCls} ${rowErr ? "row-err" : ""}`.trim() },
        h("td", { class: "num", text: String(i + 1) }),
        h("td", {}, h("div", { class: "namecell" }, h("input", {
          type: "text", value: c.name, "aria-label": `Column ${i + 1} name`, "data-row": i, autocomplete: "off", spellcheck: "false",
          "aria-invalid": rowErr ? "true" : null, "aria-describedby": rowErr ? `row-err-${i}` : null,
          oninput: (e) => { c.name = e.target.value; if (state.touched) refreshValidation(); else refreshTags(); },
        }), tag)),
        h("td", {}, h("select", { "aria-label": `Column ${i + 1} type`, onchange: (e) => { c.type = e.target.value; render(); } },
          (colField.type_options || []).map(t => h("option", { value: t, selected: t === c.type ? true : null, text: t })))),
        h("td", { class: "flag" }, h("input", {
          type: "checkbox", checked: c.nullable, disabled: c.primary_key ? true : null,
          "aria-label": `Column ${i + 1} nullable`, onchange: (e) => { c.nullable = e.target.checked; render(); },
        })),
        h("td", { class: "flag" }, h("input", {
          type: "checkbox", checked: c.primary_key, "aria-label": `Column ${i + 1} primary key`,
          onchange: (e) => { c.primary_key = e.target.checked; if (c.primary_key) c.nullable = false; render(); },
        })),
        h("td", {}, h("button", {
          type: "button", class: "icon-btn", title: `Remove column ${c.name || i + 1}`, "aria-label": `Remove column ${c.name || i + 1}`,
          disabled: cols.length <= (colField.min_rows || 1) ? true : null,
          onclick: () => { cols.splice(i, 1); state.baseline.length > i && state.baseline.splice(i, 1); render(); announce(`Removed column ${i + 1}.`); },
        }, svg(ICON_TRASH))),
      ));
      if (rowErr) rows.push(h("tr", { class: "row-err-msg" }, h("td", {}), h("td", { colspan: 5 }, h("div", { class: "err-text", id: `row-err-${i}`, text: rowErr }))));
    });

    mount(
      header(f),
      errorNotice([...(state.errors || []), ...(state.touched ? v.all : [])]),
      h("div", { class: "field" },
        h("label", { class: "lbl", for: "f-table", text: tableField.label }),
        tableInput,
        v.table ? h("div", { class: "err-text", text: v.table }) : h("div", { class: "help", id: "f-table-help", text: tableField.help || "" })),
      h("div", { class: "field" },
        h("div", { class: "lbl", id: "cols-label", text: colField.label }),
        h("table", { class: "grid", "aria-labelledby": "cols-label" },
          h("colgroup", {}, h("col", { class: "c-num" }), h("col", {}), h("col", { class: "c-type" }), h("col", { class: "c-flag" }), h("col", { class: "c-flag" }), h("col", { class: "c-del" })),
          h("thead", {}, h("tr", {}, h("th", { text: "#" }), h("th", { text: "Name" }), h("th", { text: "Type" }), h("th", { class: "flag", text: "Nullable" }), h("th", { class: "flag", text: "Primary key" }), h("th", {}, h("span", { class: "sr-only", text: "Remove" })))),
          h("tbody", {}, rows)),
        h("div", { class: "toolbar" },
          h("button", { type: "button", class: "btn ghost", onclick: addColumn }, svg(ICON_ADD), "Add column"),
          h("span", { class: "count", text: `${cols.length} column${cols.length === 1 ? "" : "s"}` }))),
      actionButtons(f, state.touched ? v : null),
    );
  }

  function addColumn() {
    const cols = state.values.columns;
    let n = cols.length + 1, name = `new_column_${n}`;
    const names = new Set(cols.map(c => c.name));
    while (names.has(name)) name = `new_column_${++n}`;
    cols.push({ name, type: "VARCHAR(255)", nullable: true, primary_key: false });
    render();
    const input = root.querySelector(`input[data-row="${cols.length - 1}"]`);
    if (input) { input.focus(); input.select(); }
    announce(`Added column ${cols.length}.`);
  }

  // Keep focus while typing: re-render, then restore focus and caret.
  function refreshValidation() { preserveFocus(render); }
  function refreshTags() { preserveFocus(render); }
  function preserveFocus(fn) {
    const a = document.activeElement;
    const key = a && (a.id || (a.dataset && a.dataset.row !== undefined ? `row:${a.dataset.row}` : null));
    const pos = a && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
    fn();
    if (!key) return;
    const el = key.startsWith("row:") ? root.querySelector(`input[data-row="${key.slice(4)}"]`) : document.getElementById(key);
    if (el) { el.focus(); if (pos) el.setSelectionRange(pos[0], pos[1]); }
  }

  const CHANGE_TAG = { renamed: ["blue", "Renamed"], added: ["green", "Added"], modified: ["purple", "Modified"], removed: ["red", "Removed"] };

  function renderReview(f) {
    mount(
      header(f),
      errorNotice(state.errors),
      h("div", { class: "tiles" }, (f.summary || []).map(s => h("div", { class: "tile" }, h("div", { class: "k", text: s.label }), h("div", { class: "v", text: s.value })))),
      h("section", { class: "section", "aria-labelledby": "chg-h" },
        h("h2", { id: "chg-h", text: "Changes from the proposal" }),
        (f.changes || []).length
          ? h("ul", { class: "changes" }, f.changes.map(c => {
              const [color, label] = CHANGE_TAG[c.kind] || ["gray", c.kind];
              return h("li", {}, h("span", { class: `tag ${color}`, text: label }), h("code", { text: c.column }), h("span", { class: "help", style: "margin:0", text: c.detail || "" }));
            }))
          : h("p", { class: "empty", text: "No changes — the proposal is accepted as is." })),
      h("section", { class: "section", "aria-labelledby": "cols-h" },
        h("h2", { id: "cols-h", text: "Columns" }),
        h("table", { class: "grid ro" },
          h("thead", {}, h("tr", {}, h("th", { text: "Name" }), h("th", { text: "Type" }), h("th", { text: "Constraints" }))),
          h("tbody", {}, (f.columns || []).map(c => h("tr", {},
            h("td", { class: "mono", text: c.name }), h("td", { class: "mono", text: c.type }),
            h("td", {}, c.primary_key ? h("span", { class: "tag blue", text: "Primary key" }) : null, " ", !c.nullable && !c.primary_key ? h("span", { class: "tag gray", text: "NOT NULL" }) : null)))))),
      h("section", { class: "section", "aria-labelledby": "ddl-h" },
        h("h2", { id: "ddl-h", text: "Generated SQL" }),
        h("pre", { class: "ddl", tabindex: "0", "aria-label": "Generated SQL", text: f.ddl || "" })),
      actionButtons(f, null),
    );
  }

  function renderDone(done) {
    mount(
      header({ eyebrow: "Table designer", title: done.title, steps: done.steps, step_index: done.step_index }),
      h("div", { class: "notice success", role: "status" }, h("div", {}, h("strong", { text: "Returned to the agent" }), h("span", { text: done.description || "" }))),
      done.ddl ? h("pre", { class: "ddl", tabindex: "0", "aria-label": "Accepted SQL", text: done.ddl }) : null,
    );
  }

  function render() {
    root.setAttribute("aria-busy", state.busy ? "true" : "false");
    if (state.completed) return renderDone(state.completed);
    const f = state.form; if (!f) return;
    if (f.view === "review") return renderReview(f);
    return renderEdit(f);
  }

  // ---------- data flow ----------
  const textOf = (result) => (result && result.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");

  function showForm(form, { initial }) {
    const changedView = !state.form || state.form.view !== form.view;
    state.form = form;
    state.errors = form.errors || [];
    if (form.view === "edit") {
      const tableField = form.fields.find(x => x.id === "table_name");
      const colField = form.fields.find(x => x.id === "columns");
      state.values = { table_name: tableField.value, columns: colField.value.map(c => ({ ...c })) };
      if (initial || !state.baseline.length) state.baseline = colField.value.map(c => ({ ...c }));
      state.touched = state.errors.length > 0;
    }
    render();
    if (changedView) { const t = document.getElementById("form-title"); if (t) { t.setAttribute("tabindex", "-1"); if (!initial) t.focus(); } }
    announce(form.title || "Form updated");
  }

  async function complete(result, sc) {
    state.completed = sc.done || { title: "Done", steps: [], step_index: 0 };
    render();
    // MCP Apps: give the model the outcome, then hand the turn back to the host.
    await app.updateModelContext({
      content: [{ type: "text", text: textOf(result) }],
      structuredContent: sc.result,
    });
    await app.sendMessage({ role: "user", content: [{ type: "text", text: sc.user_message || "Done." }] });
    announce("Design accepted and returned to the agent.");
  }

  async function handleResult(result, { initial = false } = {}) {
    if (!result) return;
    if (result.isError) {
      state.errors = [textOf(result) || "The tool reported an error."];
      render();
      return;
    }
    const sc = result.structuredContent || {};
    if (sc.status === "completed") return complete(result, sc);
    if (sc.form) return showForm(sc.form, { initial });
  }

  async function runAction(action) {
    if (state.busy) return;
    const f = state.form;
    const args = { session_id: f.session_id };
    if (action.include_fields) {
      state.touched = true;
      const v = validateEdit();
      if (!isValid(v)) {
        render();
        const bad = root.querySelector('[aria-invalid="true"]');
        if (bad) bad.focus();
        announce("Fix the highlighted fields to continue.");
        return;
      }
      args.table_name = state.values.table_name.trim();
      args.columns = state.values.columns.map(c => ({ name: c.name.trim(), type: c.type, nullable: !!c.nullable, primary_key: !!c.primary_key }));
    }
    state.busy = action.id; state.errors = []; render();
    try {
      const result = await app.callServerTool({ name: action.tool, arguments: args });
      state.busy = null;
      await handleResult(result);
    } catch (err) {
      state.busy = null;
      state.errors = [`Could not reach the tool: ${err && err.message ? err.message : err}`];
      render();
    }
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme === "dark" ? "dark" : "light";
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, val] of Object.entries(vars)) if (val) document.documentElement.style.setProperty(k, val);
  }

  const app = new App({ name: "cuga-table-designer-form", version: "1.0.0" }, {}, { autoResize: true });
  app.ontoolresult = (result) => handleResult(result, { initial: true });
  app.onhostcontextchanged = (ctx) => applyHostContext(ctx);
  app.onteardown = async () => ({});
  app.connect().then(() => applyHostContext(app.getHostContext())).catch((err) => {
    mount(errorNotice([`Could not connect to the host: ${err && err.message ? err.message : err}`]));
  });
})();
</script>
</body>
</html>
