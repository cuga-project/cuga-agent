# RITS profile for Kimi K2.7 — thinking is required, not optional.
#
# Per Moonshot's guidance: temperature 1.0 (crucial for the internal reasoning
# process), top_p 0.95, and thinking left enabled. Kimi returns a reasoning
# trace even with no reasoning_effort set, so do NOT try to disable it —
# reasoning_effort="none" would fight the model's design.
#
# Kimi accepts 'none', 'low', 'medium', 'high' (Mistral, by contrast, accepts
# only 'none' and 'high'). We set 'high' explicitly.
#
# Note temperature 1.0 differs from every other profile here, which sit at 0.1.
# That is deliberate and vendor-specified; lowering it degrades Kimi's reasoning.
#
# Use with:  AGENT_SETTING_CONFIG="settings.rits.kimi.toml"
#            MODEL_NAME / RITS_BASE_URL still override model and endpoint.

[agent.planner.model]
platform = "rits"
model_name = "moonshotai/Kimi-K2.7-Code"
url="https://inference-3scale-apicast-production.apps.rits.fmaas.res.ibm.com/moonshotai-kimi-k2-7/v1"
apikey_name = "RITS_API_KEY"
temperature = 1.0
top_p = 0.95
max_tokens = 16000
extra_params = { reasoning_effort = "high" }

