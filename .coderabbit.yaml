# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: chill
  high_level_summary: true
  suggested_labels: true
  auto_apply_labels: true

  mutually_exclusive_groups:
    readability:
      - "readability: good"
      - "readability: fair"
      - "readability: poor"
    design-impact:
      - "design-impact: low"
      - "design-impact: medium"
      - "design-impact: high"

  labeling_instructions:
    - label: "readability: good"
      instructions: |
        Apply exactly one readability label. Use good when a maintainer can grasp the goal in
        one read: a plain-language sentence up front (what problem this fixes or what it
        enables), then what/why/how-tested without decoding jargon. The PR is easy to scan:
        at most 10 changed files, OR more files with a brief explanation of why the diff is large.
        Title should be short and goal-oriented, not a stack of internal feature names.

    - label: "readability: fair"
      instructions: |
        Use fair when there is useful detail but the goal is not obvious on first read: summary
        exists but is thin (missing testing or motivation), OR 11–25 files changed without much
        context, OR the author buried the goal under technical terms without a plain opener.

    - label: "readability: poor"
      instructions: |
        Apply when a maintainer would struggle to review without asking the author first.
        Prefer poor over fair when ANY of these hold:
        - Description is empty, a one-liner ("fix", "updates", "WIP"), or default template
          with unchecked boxes and no added context
        - Title or description is jargon-heavy, overly long, or stacks many internal terms
          (flags, class names, subsystem codenames) without a plain-language goal sentence
          a non-author can parse in ~10 seconds — e.g. a long title listing three unrelated
          fixes with no "this PR stops X / enables Y" opener
        - After reading title + description, it is still unclear what user-visible or runtime
          problem is being solved (lots of words but no clear goal)
        - Missing two or more of: what changed, why, how it was tested (or explicit "not tested"
          with reason)
        - More than 25 files changed with no explanation of scope, grouping, or rollout order
        - More than ~400 net changed lines (adds+deletes) with no walkthrough of the main hunks
        - Unrelated concerns bundled (e.g. feature + refactor + formatting + deps) with no
          sectioned breakdown in the description
        - Large mechanical diff (lockfiles, generated output, mass renames) dominating the PR
          without calling that out upfront
        - Touches 3+ top-level areas (e.g. agent-graph, server, frontend, infra, knowledge)
          with no map of which part to review first
        - Title/description disagree with the diff (title says "docs" but code changes dominate,
          or "fix" but only new features)
        - Breaking, security, auth, migration, or config changes present in the diff but not
          mentioned in the description
        - No linked issue for a non-trivial change (roughly >5 files or non-obvious behavior)
        Use fair instead of poor only when one dimension is weak but the goal is stated plainly
        in the first sentence (e.g. "Fixes login timeout" plus light testing notes).

    # Design impact asks whether the change needs a design decision, not how big the diff is.
    - label: "design-impact: low"
      instructions: |
        Apply exactly one design-impact label. Use low when the diff needs no design decision.
        Require ALL of:
        - Follows an existing pattern; adds no new abstraction, extension point, or subsystem
        - No change to a public contract: API/SDK schemas, config keys, CLI commands,
          event or streaming protocols, stored data schemas
        - No new dependency, external service, or storage backend
        - One concern, easy to revert
        Examples: a bug fix that restores documented behavior, a new tool or model provider
        added through the existing interface, a mechanical rename. A large diff can still be low.

    - label: "design-impact: medium"
      instructions: |
        Apply exactly one design-impact label. Use medium when the diff adds real logic but
        stays bounded: new behavior in one or two areas, no new public contract, and no new
        pattern other features will reuse. Use medium when any low criterion fails and no
        high criterion applies.

    - label: "design-impact: high"
      instructions: |
        Apply exactly one design-impact label. Use high when the diff needs a design decision.
        ANY of:
        - New or changed public contract, a breaking change, or a data migration
        - New subsystem, abstraction, or pattern that other features will reuse
        - Changes to the agent loop, multi-agent orchestration, events, function calling,
          or sub-agent spawning
        - Security, auth, sandboxing, or policy enforcement behavior
        - Hard to reverse once released
        A small diff can still be high.

    # Area labels: one label for every area whose behavior the PR changes in non-test code,
    # judged from the diff with paths as hints. CodeRabbit does not read YAML comments, so
    # each rule states this itself.
    - label: "area: frontend"
      instructions: |
        Apply when the PR changes UI behavior in non-test source code: UI components, styling,
        accessibility, client state, navigation, chat, dashboards, browser-extension UI, or
        desktop UI. Typical paths include src/frontend_workspaces/ and
        src/cuga/backend/cuga_dashboard/. A dependency-only update does not qualify. Mentions in
        tests, mocks, comments, docstrings, or generated files do not count. Apply every area
        label whose rule matches: a PR that changes several areas gets one label for each (for
        example frontend, api-sdk, and orchestration for a feature that changes the UI, the
        server API, and the agent graph). A PR that changes non-test code gets at least one area
        label.

    - label: "area: security"
      instructions: |
        Apply when the PR changes security behavior in non-test source code: authentication,
        authorization, credential or secret handling, sandboxing, tenant/session isolation,
        untrusted input handling, or sensitive data exposure or retention. Check all layers, not
        only auth directories. A regenerated .secrets.baseline, a dependency bump, or a
        description that only mentions security does not qualify. This is not a vulnerability
        finding. Mentions in tests, mocks, comments, docstrings, or generated files do not
        count. Apply every area label whose rule matches: a PR that changes several areas gets
        one label for each (for example frontend, api-sdk, and orchestration for a feature that
        changes the UI, the server API, and the agent graph). A PR that changes non-test code
        gets at least one area label.

    - label: "area: policies"
      instructions: |
        Apply when the PR changes policy behavior in non-test source code: guardrails, tool
        approval rules, policy matching, enforcement, playbooks, or policy administration,
        including src/cuga/backend/cuga_graph/policy/ and related UI or SDK behavior. Disabling
        or mocking the policy system in tests does not qualify. Mentions in tests, mocks,
        comments, docstrings, or generated files do not count. Apply every area label whose rule
        matches: a PR that changes several areas gets one label for each (for example frontend,
        api-sdk, and orchestration for a feature that changes the UI, the server API, and the
        agent graph). A PR that changes non-test code gets at least one area label.

    - label: "area: orchestration"
      instructions: |
        Apply when the PR changes orchestration behavior in non-test source code: agent graph
        execution, supervisor routing, delegation, agent spawning, shared execution state,
        checkpoints, cancellation, retries, or human-in-the-loop pause/resume behavior. Paths
        include cuga_graph/, supervisor/, supervisor_utils/, and backend/agent_spawn/ under
        src/cuga/. A file under cuga_graph/ does not qualify on its path alone. Mentions in
        tests, mocks, comments, docstrings, or generated files do not count. Apply every area
        label whose rule matches: a PR that changes several areas gets one label for each (for
        example frontend, api-sdk, and orchestration for a feature that changes the UI, the
        server API, and the agent graph). A PR that changes non-test code gets at least one area
        label.

    - label: "area: prompts"
      instructions: |
        Apply when the PR changes model-facing text in non-test files: LLM prompts, agent
        instructions, skills, prompt construction, context supplied to a model, or model output
        requirements, including prompts embedded in Python, configuration, or Markdown. The word
        "prompt" used for a user's request text does not qualify. Ordinary documentation is not
        a prompt. Mentions in tests, mocks, comments, docstrings, or generated files do not
        count. Apply every area label whose rule matches: a PR that changes several areas gets
        one label for each (for example frontend, api-sdk, and orchestration for a feature that
        changes the UI, the server API, and the agent graph). A PR that changes non-test code
        gets at least one area label.

    - label: "area: llm-integrations"
      instructions: |
        Apply when the PR changes model integration in non-test source code: model-provider
        integrations, model selection, inference parameters, reasoning settings, token
        accounting, or model request/response handling. Typical paths include
        src/cuga/backend/llm/ and src/cuga/configurations/models/. Prompt wording alone does not
        qualify. Mentions in tests, mocks, comments, docstrings, or generated files do not
        count. Apply every area label whose rule matches: a PR that changes several areas gets
        one label for each (for example frontend, api-sdk, and orchestration for a feature that
        changes the UI, the server API, and the agent graph). A PR that changes non-test code
        gets at least one area label.

    - label: "area: tools-integrations"
      instructions: |
        Apply when the PR changes tool behavior in non-test source code: tool registration,
        discovery, invocation, MCP clients or servers, external service adapters, or runtime
        skill/tool loading. Typical paths include src/cuga/backend/tools_env/,
        src/cuga/backend/skills/, and demo tools. Mentions in tests, mocks, comments,
        docstrings, or generated files do not count. Apply every area label whose rule matches:
        a PR that changes several areas gets one label for each (for example frontend, api-sdk,
        and orchestration for a feature that changes the UI, the server API, and the agent
        graph). A PR that changes non-test code gets at least one area label.

    - label: "area: browser-automation"
      instructions: |
        Apply when the PR changes browser automation in non-test source code: browser control,
        page understanding, browser sessions, web navigation, or automated interaction with
        pages. Typical paths include src/cuga/backend/browser_env/ and
        src/cuga/backend/web_automation/. A browser-extension UI change alone does not qualify.
        Mentions in tests, mocks, comments, docstrings, or generated files do not count. Apply
        every area label whose rule matches: a PR that changes several areas gets one label for
        each (for example frontend, api-sdk, and orchestration for a feature that changes the
        UI, the server API, and the agent graph). A PR that changes non-test code gets at least
        one area label.

    - label: "area: api-sdk"
      instructions: |
        Apply when the PR changes a public interface in non-test source code: server endpoints,
        SDK methods, public request/response schemas, streaming or event protocols, A2A/ACP
        integration, or API compatibility. Typical paths include src/cuga/api/, src/cuga/sdk.py,
        src/cuga/sdk_core/, and src/cuga/backend/server/. Internal server helpers do not
        qualify. Mentions in tests, mocks, comments, docstrings, or generated files do not
        count. Apply every area label whose rule matches: a PR that changes several areas gets
        one label for each (for example frontend, api-sdk, and orchestration for a feature that
        changes the UI, the server API, and the agent graph). A PR that changes non-test code
        gets at least one area label.

    - label: "area: cli"
      instructions: |
        Apply when the PR changes CLI behavior in non-test source code: CLI commands, options,
        terminal output, interactive terminal flows, or command-driven setup. Typical paths
        include src/cuga/cli/. Mentions in tests, mocks, comments, docstrings, or generated
        files do not count. Apply every area label whose rule matches: a PR that changes several
        areas gets one label for each (for example frontend, api-sdk, and orchestration for a
        feature that changes the UI, the server API, and the agent graph). A PR that changes
        non-test code gets at least one area label.

    - label: "area: knowledge"
      instructions: |
        Apply when the PR changes knowledge behavior in non-test source code: knowledge
        ingestion, document processing, retrieval, embeddings, indexing, or knowledge profiles.
        Typical paths include src/cuga/backend/knowledge/ and
        src/cuga/configurations/knowledge/. Mentions in tests, mocks, comments, docstrings, or
        generated files do not count. Apply every area label whose rule matches: a PR that
        changes several areas gets one label for each (for example frontend, api-sdk, and
        orchestration for a feature that changes the UI, the server API, and the agent graph). A
        PR that changes non-test code gets at least one area label.

    - label: "area: memory"
      instructions: |
        Apply when the PR changes memory behavior in non-test source code: conversation or agent
        memory, context summarization, memory retrieval, or retained context across runs.
        Typical paths include src/cuga/backend/memory/. Loading or showing chat history in the
        UI alone does not qualify. Mentions in tests, mocks, comments, docstrings, or generated
        files do not count. Apply every area label whose rule matches: a PR that changes several
        areas gets one label for each (for example frontend, api-sdk, and orchestration for a
        feature that changes the UI, the server API, and the agent graph). A PR that changes
        non-test code gets at least one area label.

    - label: "area: storage"
      instructions: |
        Apply when the PR changes how data is stored, in non-test source code: databases, data
        schemas, migrations, storage backends, filesystem read/write behavior, or data
        import/export. Typical paths include src/cuga/backend/storage/ and src/cuga/dbs/.
        Reading from an existing store without changing how data is stored does not qualify.
        Mentions in tests, mocks, comments, docstrings, or generated files do not count. Apply
        every area label whose rule matches: a PR that changes several areas gets one label for
        each (for example frontend, api-sdk, and orchestration for a feature that changes the
        UI, the server API, and the agent graph). A PR that changes non-test code gets at least
        one area label.

    - label: "area: configuration"
      instructions: |
        Apply when the PR changes configuration in non-test files: application settings,
        defaults, environment-variable handling, feature flags, configuration loading,
        validation, or compatibility. Typical paths include src/cuga/config.py,
        src/cuga/settings.toml, src/cuga/configurations/, and .env.example. One new setting that
        only supports a feature in another area does not qualify. CI-only edits belong to infra.
        Mentions in tests, mocks, comments, docstrings, or generated files do not count. Apply
        every area label whose rule matches: a PR that changes several areas gets one label for
        each (for example frontend, api-sdk, and orchestration for a feature that changes the
        UI, the server API, and the agent graph). A PR that changes non-test code gets at least
        one area label.

    - label: "area: observability"
      instructions: |
        Apply when the PR changes observability in non-test source code: logs, traces, metrics,
        activity tracking, telemetry callbacks, or exported execution trajectories. Typical
        paths include src/cuga/backend/observability/ and src/cuga/backend/activity_tracker/.
        Mentions in tests, mocks, comments, docstrings, or generated files do not count. Apply
        every area label whose rule matches: a PR that changes several areas gets one label for
        each (for example frontend, api-sdk, and orchestration for a feature that changes the
        UI, the server API, and the agent graph). A PR that changes non-test code gets at least
        one area label.

    - label: "area: testing-evaluation"
      instructions: |
        Apply only when tests or evaluation are the main point of the change: test tooling,
        shared fixtures, evaluation datasets, benchmarks, scoring, stability checks, or a PR
        that is mostly tests. Tests that a feature or fix adds for its own code do not qualify.
        Typical paths include tests/ and src/cuga/evaluation/. Apply every area label whose rule
        matches: a PR that changes several areas gets one label for each (for example frontend,
        api-sdk, and orchestration for a feature that changes the UI, the server API, and the
        agent graph). A PR that changes non-test code gets at least one area label.

    - label: "area: infra"
      instructions: |
        Apply when the PR changes infrastructure files: CI workflows, repository automation
        (including CodeRabbit configuration), containers, deployment, release processes, build
        tooling, or packaging. Typical paths include .github/, .coderabbit.yaml, Dockerfile*,
        deployment/, and scripts/. Issue-template prose alone is docs. Mentions in tests, mocks,
        comments, docstrings, or generated files do not count. Apply every area label whose rule
        matches: a PR that changes several areas gets one label for each (for example frontend,
        api-sdk, and orchestration for a feature that changes the UI, the server API, and the
        agent graph). A PR that changes non-test code gets at least one area label.

    - label: "area: dependencies"
      instructions: |
        Apply when the diff adds, removes, or updates dependencies, version constraints,
        overrides, or resolved lockfile entries, including Python, frontend, container-base, and
        GitHub Actions dependencies. Edits to unrelated sections of a package manifest do not
        qualify. Apply every area label whose rule matches: a PR that changes several areas gets
        one label for each (for example frontend, api-sdk, and orchestration for a feature that
        changes the UI, the server API, and the agent graph). A PR that changes non-test code
        gets at least one area label.

    - label: "area: docs"
      instructions: |
        Apply when the PR changes documentation files: guides, READMEs, architecture documents,
        contributor instructions, or documented examples. Docstrings and code comments do not
        qualify. Runtime prompt or skill Markdown is not documentation. Apply every area label
        whose rule matches: a PR that changes several areas gets one label for each (for example
        frontend, api-sdk, and orchestration for a feature that changes the UI, the server API,
        and the agent graph). A PR that changes non-test code gets at least one area label.

    - label: "area: licensing"
      instructions: |
        Apply when the PR changes licensing: licenses, notices, attribution, license policy,
        dependency license allowlists/baselines, or license enforcement. Typical paths include
        LICENSE, NOTICE, .github/licenses/, and scripts/licenses/. Mentions in tests, mocks,
        comments, docstrings, or generated files do not count. Apply every area label whose rule
        matches: a PR that changes several areas gets one label for each (for example frontend,
        api-sdk, and orchestration for a feature that changes the UI, the server API, and the
        agent graph). A PR that changes non-test code gets at least one area label.

  slop_detection:
    enabled: true
    label: "ai-spam"

  auto_review:
    enabled: true
    drafts: false

issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    # Suggest only: a person confirms the labels at triage.
    auto_apply_labels: false
    # Same design-impact and area labels as PRs, judged from the issue text instead of a
    # diff. They decide the design path in the development guidelines; the PR labels are
    # the backup check. File paths, stack traces, and component names are hints.
    labeling_instructions:
      - label: "design-impact: low"
        instructions: |
          Suggest exactly one design-impact label. Use low when the work needs no design
          decision. Require ALL of:
          - Follows an existing pattern; adds no new abstraction, extension point, or subsystem
          - No change to a public contract: API/SDK schemas, config keys, CLI commands,
            event or streaming protocols, stored data schemas
          - No new dependency, external service, or storage backend
          - One concern, easy to revert
          Examples: a bug fix that restores documented behavior, a new tool or model provider
          added through the existing interface, a mechanical rename.

      - label: "design-impact: medium"
        instructions: |
          Suggest exactly one design-impact label. Use medium when the work adds real logic
          but stays bounded: new behavior in one or two areas, no new public contract, and no
          new pattern other features will reuse. Use medium when any low criterion fails and
          no high criterion applies, or when the issue is too vague to judge.

      - label: "design-impact: high"
        instructions: |
          Suggest exactly one design-impact label. Use high when the work needs a design
          decision. ANY of:
          - New or changed public contract, a breaking change, or a data migration
          - New subsystem, abstraction, or pattern that other features will reuse
          - Changes to the agent loop, multi-agent orchestration, events, function calling,
            or sub-agent spawning
          - Security, auth, sandboxing, or policy enforcement behavior
          - Hard to reverse once released

      - label: "area: frontend"
        instructions: |
          Suggest when the work will change UI components, styling, accessibility, client
          state, navigation, chat, dashboards, browser-extension UI, or desktop UI, or the
          issue reports a bug that users see in that UI. Suggest only for a main part of the work.

      - label: "area: security"
        instructions: |
          Suggest when the work will change authentication, authorization, credential or
          secret handling, sandboxing, tenant/session isolation, untrusted input handling,
          or sensitive data exposure or retention. Do not suggest only because the issue
          mentions security. Suggest only for a main part of the work.

      - label: "area: policies"
        instructions: |
          Suggest when the work will change guardrails, tool approval rules, policy matching,
          enforcement, playbooks, or policy administration. Suggest only for a main part
          of the work, with security when applicable.

      - label: "area: orchestration"
        instructions: |
          Suggest when the work will change agent graph execution, supervisor routing,
          delegation, multi-agent orchestration, sub-agent spawning, shared execution state,
          checkpoints, cancellation, retries, or human-in-the-loop pause/resume behavior.
          Suggest only for a main part of the work.

      - label: "area: prompts"
        instructions: |
          Suggest when the work will change LLM prompts, agent instructions, skills, prompt
          construction, context supplied to a model, or model output requirements.
          Suggest only for a main part of the work.

      - label: "area: llm-integrations"
        instructions: |
          Suggest when the work will change model-provider integrations, model selection,
          inference parameters, reasoning settings, token accounting, or model
          request/response handling. Prompt wording alone does not qualify.
          Suggest only for a main part of the work.

      - label: "area: tools-integrations"
        instructions: |
          Suggest when the work will change tool registration, discovery, invocation, MCP
          clients or servers, external service adapters, or runtime skill/tool loading.
          Suggest only for a main part of the work.

      - label: "area: browser-automation"
        instructions: |
          Suggest when the work will change browser control, page understanding, browser
          sessions, web navigation, or automated interaction with pages. A browser-extension
          UI change alone does not qualify. Suggest only for a main part of the work.

      - label: "area: api-sdk"
        instructions: |
          Suggest when the work will change server endpoints, SDK methods, public
          request/response schemas, streaming or event protocols, A2A/ACP integration, or
          API compatibility. Suggest only for a main part of the work.

      - label: "area: cli"
        instructions: |
          Suggest when the work will change CLI commands, options, terminal output,
          interactive terminal flows, or command-driven setup.
          Suggest only for a main part of the work.

      - label: "area: knowledge"
        instructions: |
          Suggest when the work will change knowledge ingestion, document processing,
          retrieval, embeddings, indexing, or knowledge profiles.
          Suggest only for a main part of the work.

      - label: "area: memory"
        instructions: |
          Suggest when the work will change conversation or agent memory, context
          summarization, memory retrieval, or retained context across runs.
          Suggest only for a main part of the work.

      - label: "area: storage"
        instructions: |
          Suggest when the work will change databases, persistence, data schemas,
          migrations, storage backends, filesystem read/write behavior, or data
          import/export. Suggest only for a main part of the work.

      - label: "area: configuration"
        instructions: |
          Suggest when the work will change application settings, defaults,
          environment-variable handling, feature flags, or configuration loading and
          validation. CI-only changes belong to infra. Suggest only for a main part of the work.

      - label: "area: observability"
        instructions: |
          Suggest when the work will change logs, traces, metrics, activity tracking,
          telemetry callbacks, or exported execution trajectories.
          Suggest only for a main part of the work.

      - label: "area: testing-evaluation"
        instructions: |
          Suggest when the main ask is tests, fixtures, test tooling, evaluation datasets,
          benchmarks, scoring, or stability checks. Do not suggest only because the work
          will need tests. Suggest only for a main part of the work.

      - label: "area: infra"
        instructions: |
          Suggest when the work will change CI workflows, repository automation, containers,
          deployment, release processes, build tooling, or packaging.
          Suggest only for a main part of the work.

      - label: "area: dependencies"
        instructions: |
          Suggest when the issue asks to add, remove, or update a dependency or version
          constraint, or the work clearly needs a new dependency. Do not suggest only
          because a library is mentioned. Suggest only for a main part of the work.

      - label: "area: docs"
        instructions: |
          Suggest when the issue asks for documentation, guides, READMEs, architecture
          documents, contributor instructions, or documented examples. Runtime prompt or
          skill Markdown is not documentation. Suggest only for a main part of the work.

      - label: "area: licensing"
        instructions: |
          Suggest when the work will change licenses, notices, attribution, license policy,
          dependency license allowlists, or license enforcement.
          Suggest only for a main part of the work.
